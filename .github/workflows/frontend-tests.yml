name: Frontend Tests

# No trigger-level `paths:` filter, deliberately. A workflow skipped by one
# reports no conclusion at all, and a required check that never reports leaves
# a pull request unable to enter a merge queue and a merge group unable to
# leave it. `merge_group` cannot carry a `paths:` filter in the first place.
# The filter lives in the `changes` job below instead, and `frontend-gate`
# reports the single conclusion the queue waits on. See docs/ci-merge-queue.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a merge-queue run. Its ref is unique per queue entry, so a
  # cancellation here could only come from a mis-keyed group, and the queue
  # would read the cancelled check as a failure and eject the pull request.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

# Least-privilege: the `frontend` job only reads source and runs tests.
# `packages: read` lets the container job pull the kandev-ci image from GHCR.
permissions:
  contents: read
  packages: read

jobs:
  # The former trigger-level `paths:` list, applied one level down so a skip
  # still produces a conclusion. `.github/scripts/changed-paths.py` implements
  # the same last-match-wins semantics GitHub applies to `paths:`.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.detect.outputs.run }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # The base commit has to be present locally for the diff below. Every
          # other job in this workflow already pays for a full clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant changes
        id: detect
        env:
          PATTERNS: |
            apps/cli/**
            apps/package.json
            apps/prettier.config.mjs
            apps/.prettierignore
            apps/web/**
            apps/packages/**
            apps/pnpm-lock.yaml
            apps/backend/go.mod
            apps/backend/go.sum
            .github/workflows/frontend-tests.yml
            .github/scripts/changed-paths.py
            !**/*.md
            !**/*.mdx
            !**/*.markdown
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            # The checkout is the merge ref, whose first parent is the base
            # branch tip. Diffing against that tip directly collapses to a
            # two-dot diff over everything main landed since the PR opened, so
            # take the fork point -- the same correction the steps below make.
            pull_request) BASE="$(git merge-base HEAD "origin/${BASE_REF}")" ;;
            # The queue branch is cut from this commit, so it is a true ancestor.
            merge_group) BASE="${MERGE_GROUP_BASE_SHA}" ;;
            push) BASE="${PUSH_BEFORE}" ;;
            *) BASE="" ;;
          esac

          # Fail open. A first push to a branch, a force push, or an unknown
          # event leaves no usable base, and running the suite needlessly is
          # cheaper than merging something no job ever looked at.
          if [[ -z "${BASE}" || "${BASE}" == "0000000000000000000000000000000000000000" ]] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable base commit for '${EVENT_NAME}'; running everything."
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `-z`, not plain --name-only: git quotes non-ASCII paths under its
          # default core.quotePath, and a quoted path matches no pattern, so a
          # change to one would skip every job and still report success.
          git diff --name-only -z "${BASE}" HEAD \
            | python3 .github/scripts/changed-paths.py

  frontend:
    name: Run Frontend Lint, Tests, and Build
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Pre-baked image bundles Node 24, pnpm 9.15.9, Go, and go-licenses —
    # see .github/docker/ci-base/Dockerfile.
    container: ghcr.io/kdlbs/kandev-ci:build-latest
    defaults:
      run:
        # Container jobs default to `sh` (dash); pin to bash for `set -euo
        # pipefail` and other bash-isms used by the formatting / licenses steps.
        shell: bash
        working-directory: apps

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0

      - name: Mark workspace safe for git
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('apps/pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate OSS licenses manifest
        run: pnpm --filter @kandev/web licenses:gen

      - name: Verify licenses manifest is fresh
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          # `defaults.run.working-directory` is `apps`, so the path is relative.
          # The diff is reported as a warning, not a hard failure: `go-licenses`
          # resolves slightly different license metadata across platforms (macOS
          # dev vs. ubuntu CI) for the same Go modules, and we have not yet
          # eliminated that drift. The committed file is still the source of
          # truth for what the page renders.
          if ! git diff --quiet --exit-code web/generated/licenses.json; then
            echo "::warning::apps/web/generated/licenses.json differs from a fresh re-run."
            echo "::warning::Run 'pnpm --filter @kandev/web licenses:gen' and commit if the drift is real."
            git --no-pager diff --stat web/generated/licenses.json || true
          fi

      - name: Check formatting
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # On `pull_request` the checkout is the MERGE REF, whose first parent is
          # the base branch tip. `pull_request.base.sha` is the base tip from when
          # the PR event fired, so it is an ANCESTOR of that merge ref — which
          # makes `base...HEAD` collapse to a two-dot diff and list everything
          # main landed since the PR opened. Over-broad is harmless here (the
          # extra files are already formatted), but it is the same trap the i18n
          # ratchet below hit for real, so do not copy the old idiom. The fork
          # point is what "changed in this PR" actually means.
          #
          # `merge_group` has no PR context at all. Its own base_sha is the
          # commit the queue branch was cut from, which is already the fork
          # point, so no correction is needed there.
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="$(git merge-base HEAD "origin/${BASE_REF}")"
          elif [[ "${EVENT_NAME}" == "merge_group" ]]; then
            BASE_SHA="${MERGE_GROUP_BASE_SHA}"
          else
            BASE_SHA="${PUSH_BEFORE}"
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi

          CHANGED_FILES="$(
            git diff --name-only --diff-filter=ACMRT "${BASE_SHA}" HEAD \
            | grep -E '^apps/(web|cli|packages)/.*\.(ts|tsx|js|jsx|mjs|cjs|json|md|mdx|yml|yaml|css|scss)$' \
            || true
          )"

          if [[ -z "${CHANGED_FILES}" ]]; then
            echo "No Prettier-scoped files changed."
            exit 0
          fi

          # Skip symlinks — prettier errors with exit 123 when an explicit
          # pattern is a symbolic link. CLAUDE.md files in the tree are symlinks
          # to sibling AGENTS.md files (Codex / Claude Code convention).
          FILES_TO_CHECK="$(
            echo "${CHANGED_FILES}" \
              | sed 's#^apps/##' \
              | while IFS= read -r f; do [ -L "$f" ] || echo "$f"; done
          )"

          if [[ -z "${FILES_TO_CHECK}" ]]; then
            echo "No non-symlink Prettier-scoped files changed."
            exit 0
          fi

          echo "Checking Prettier on changed files:"
          echo "${FILES_TO_CHECK}"
          echo "${FILES_TO_CHECK}" | xargs pnpm exec prettier --check --ignore-unknown

      - name: Run lint
        run: pnpm --filter @kandev/web lint

      # `build` below is Vite, which strips types with esbuild and never checks
      # them, so nothing in this job used to fail on a type error. Runs before
      # the tests to fail fast on the cheaper check.
      - name: Run typecheck
        run: pnpm --filter @kandev/web typecheck

      - name: Verify standalone plugin SDK contract
        run: pnpm --filter @kandev/plugin-sdk test && pnpm --filter @kandev/plugin-sdk typecheck

      # Unlike the eslint literal-string guard (scoped to already-migrated paths
      # via i18nGuardFiles), these five checks scan components/app/hooks/lib
      # repo-wide. Each one pins a class of i18n bug that fails silently at
      # runtime: a key with no catalog entry, <Trans> tag markup rendered
      # verbatim, an English plural ending passed as a value, t() at module
      # scope frozen at the boot locale, and em dashes in public copy. See
      # docs/i18n.md.
      - name: Run i18n checks
        run: pnpm --filter @kandev/web i18n:check

      # New-code ratchet. The eslint literal guard is an error only on migrated
      # paths, which leaves new files under un-migrated directories unguarded.
      # These two judge the CHANGE instead of the FILE: an added file must be
      # clean outright, a modified file only on the lines it touched, and the
      # guard allowlist may not shrink. Same model as
      # `golangci-lint --new-from-rev` for Go.
      - name: Run i18n new-code ratchet
        shell: bash
        # The job defaults to `apps`; these scripts live one level deeper.
        working-directory: apps/web
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # DO NOT pass --base on pull_request. The checkout is the merge ref
          # `refs/pull/N/merge`, and `pull_request.base.sha` is the base branch tip
          # from when the PR event fired — an ancestor of that merge ref. Handing
          # it in made the ratchet judge every commit main landed since the PR
          # opened as this PR's new code, failing PRs on files they never touched
          # (#2160). The scripts' own default, `merge-base HEAD origin/main`,
          # resolves to the merge ref's base-side parent and is correct here;
          # origin/main is present because the checkout is fetch-depth: 0.
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            node scripts/run-i18n-ratchet.mjs
            exit 0
          fi

          # merge_group: the queue branch is cut from base_sha and carries only
          # the queued pull requests on top, so that IS the fork point. The
          # scripts' `origin/main` default is wrong here — main may already have
          # moved past what this merge group was built on.
          if [[ "${EVENT_NAME}" == "merge_group" ]]; then
            BASE_SHA="${MERGE_GROUP_BASE_SHA}"
          else
            # push: HEAD *is* the new base branch tip, so there is no fork point to
            # find and the previous tip is the only meaningful base.
            BASE_SHA="${PUSH_BEFORE}"
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            echo "No usable base SHA; skipping the new-code ratchet."
            exit 0
          fi

          node scripts/run-i18n-ratchet.mjs --base "${BASE_SHA}"

      # New-code ratchet for E2E waits. `page.waitForTimeout(500)` and
      # hand-rolled promise sleeps are the suite's most reliable source of flake:
      # a hand-picked number that was long enough on the machine it was written
      # on. The sanctioned forms (`dwell`, `injectLatency` in
      # e2e/helpers/causal-waits.ts) take a category and a reason.
      #
      # The eslint rule is an error only on directories already converted to
      # zero, so this judges the CHANGE instead of the FILE for everywhere else —
      # added files whole, modified files only on touched lines. Same base
      # handling as the i18n step above, and the same reason for it: DO NOT pass
      # --base on pull_request.
      - name: Run E2E sleep ratchet
        shell: bash
        working-directory: apps/web
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            node scripts/check-new-e2e-sleeps.mjs
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "merge_group" ]]; then
            BASE_SHA="${MERGE_GROUP_BASE_SHA}"
          else
            BASE_SHA="${PUSH_BEFORE}"
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            echo "No usable base SHA; skipping the E2E sleep ratchet."
            exit 0
          fi

          node scripts/check-new-e2e-sleeps.mjs --base "${BASE_SHA}"

      # Deliberately run under the variable that broke the suite, so a
      # regression fails here instead of only in a container. React exports
      # `act()` from its development build alone, `vitest.config.ts` pins
      # `NODE_ENV=test` to force that build, and this image sets no NODE_ENV of
      # its own — so without this line CI would pass with the pin deleted while
      # every `render()` throws `TypeError: React.act is not a function` for
      # anyone whose shell inherits the runtime image's `NODE_ENV=production`
      # (`Dockerfile`). That gap is exactly how the breakage went unnoticed.
      # Scoped to this step: `pnpm install` above must keep seeing devDependencies
      # through its own resolution, not through `apps/.npmrc`'s `production=false`.
      - name: Run tests
        env:
          NODE_ENV: production
        run: pnpm --filter @kandev/web test

      - name: Build
        run: pnpm --filter @kandev/web build

  # The required check. Runs on every event, including the ones where the
  # `frontend` job above is correctly skipped, so the merge queue always has a
  # conclusion to read instead of a check that stays pending forever.
  frontend-gate:
    name: Frontend Tests Passed
    runs-on: ubuntu-latest
    needs: [changes, frontend]
    if: always()

    steps:
      - name: Require the frontend job to have passed or been skipped
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          set -euo pipefail

          # `skipped` is a pass: the change-detection job decided nothing this
          # workflow covers was touched. `cancelled` is not — a cancelled job
          # never reached a verdict, and treating that as a pass would let an
          # untested merge group through.
          if [[ "${CHANGES_RESULT}" != "success" ]]; then
            echo "Change detection finished with result: ${CHANGES_RESULT}" >&2
            exit 1
          fi
          if [[ "${FRONTEND_RESULT}" != "success" && "${FRONTEND_RESULT}" != "skipped" ]]; then
            echo "Frontend job finished with result: ${FRONTEND_RESULT}" >&2
            exit 1
          fi
          echo "Change detection: ${CHANGES_RESULT}; frontend: ${FRONTEND_RESULT}"
