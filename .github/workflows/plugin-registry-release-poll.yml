name: Plugin Registry Curated Release Poll

# Central least-privilege release signal. Repository identities come only from
# the checked-out curated allowlist; plugin repositories hold no Kandev token
# and cannot submit a repository or deployment payload.
on:
  workflow_dispatch:
  schedule:
    # GitHub schedules are best-effort. This off-boundary five-minute poll
    # targets publication within 10 minutes under normal provider scheduling.
    - cron: "3-58/5 * * * *"

permissions:
  contents: read

jobs:
  detect:
    name: Check curated repositories
    runs-on: ubuntu-latest
    outputs:
      rebuild: ${{ steps.detect.outputs.rebuild }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Test release detector
        run: node --test plugin-registry/check-releases.test.mjs

      - name: Detect newer curated releases
        id: detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node plugin-registry/check-releases.mjs

  publish:
    name: Rebuild official marketplace
    needs: detect
    if: needs.detect.outputs.rebuild == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/plugin-registry-index.yml
    with:
      reason: curated-release-poll
