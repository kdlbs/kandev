          git fetch --no-tags --prune origin "$BASE_SHA"
          git show "$BASE_SHA:.github/actions/setup-opencode/action.yml" > .trusted-actions/setup-opencode/action.yml

          RANGE="$BASE_SHA...$HEAD_SHA"
