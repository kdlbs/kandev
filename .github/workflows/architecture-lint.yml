name: Architecture Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  # Pull requests can supersede one another safely. Pushes compare each commit
  # with its own before-SHA, so never cancel a push run before that comparison
  # completes. Merge-queue runs are keyed by their own merge-group SHA for the
  # same reason, and are likewise never cancelled: the queue reads a cancelled
  # check as a failure and ejects the pull request.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  runner_plan:
    name: Plan external runner allocation
    runs-on: ubuntu-latest
    outputs:
      lint_runner: ${{ steps.plan.outputs.lint_runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Plan runner allocation
        id: plan
        env:
          KANDEV_CI_EXTERNAL_ENABLED: ${{ vars.KANDEV_CI_EXTERNAL_ENABLED }}
          KANDEV_CI_EXTERNAL_PERCENT: ${{ vars.KANDEV_CI_EXTERNAL_PERCENT }}
          KANDEV_CI_RUNNER_LIGHT: ${{ vars.KANDEV_CI_RUNNER_LIGHT }}
          KANDEV_CI_RUNNER_STANDARD: ${{ vars.KANDEV_CI_RUNNER_STANDARD }}
        run: |
          python3 .github/scripts/runner-plan.py \
            --workflow architecture \
            --run-id "$GITHUB_RUN_ID" \
            --burst "$KANDEV_CI_EXTERNAL_ENABLED" \
            --percent "$KANDEV_CI_EXTERNAL_PERCENT" \
            --light-label "$KANDEV_CI_RUNNER_LIGHT" \
            --standard-label "$KANDEV_CI_RUNNER_STANDARD" \
            --output "$GITHUB_OUTPUT"

  lint:
    name: Architecture boundaries do not regress
    needs: runner_plan
    if: always()
    runs-on: ${{ needs.runner_plan.outputs.lint_runner == 'external' && vars.KANDEV_CI_RUNNER_LIGHT || 'ubuntu-latest' }}

    steps:
      - name: Require runner plan
        env:
          RUNNER_PLAN_RESULT: ${{ needs.runner_plan.result }}
        run: |
          if [[ "${RUNNER_PLAN_RESULT}" != "success" ]]; then
            echo "Runner planning finished with result: ${RUNNER_PLAN_RESULT}" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run linter tests
        run: python3 scripts/lint-architecture.test.py

      # One step rather than one per event. Each event names the baseline
      # commit differently, and a `merge_group` run has neither of the two the
      # split steps used to read: no `event.pull_request`, no `event.before`.
      # Under the old shape it would have run the linter tests and silently
      # linted nothing, which is the worst possible outcome for a required
      # check — green, and having compared the branch against nothing.
      - name: Resolve the architecture baseline
        id: baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          case "${EVENT_NAME}" in
            pull_request) BASE_REF="${PR_BASE_SHA}" ;;
            # The queue branch is cut from this commit, so it is the merge
            # group's equivalent of the pull request's base.
            merge_group) BASE_REF="${MERGE_GROUP_BASE_SHA}" ;;
            push) BASE_REF="${PUSH_BEFORE}" ;;
            # The updater dispatches this workflow against its stable bot
            # branch, so the main branch fork point is the PR baseline.
            workflow_dispatch) BASE_REF="$(git merge-base HEAD origin/main)" ;;
            *) BASE_REF="" ;;
          esac

          if [[ -z "${BASE_REF}" ]]; then
            echo "No baseline commit for event '${EVENT_NAME}'." >&2
            exit 1
          fi

          echo "base-ref=${BASE_REF}" >> "$GITHUB_OUTPUT"
          echo "Architecture baseline: ${BASE_REF}"

      - name: Lint architecture
        env:
          ARCHITECTURE_BASE_REF: ${{ steps.baseline.outputs.base-ref }}
        run: >-
          python3 scripts/lint-architecture.py --all
          --baseline-base-ref "$ARCHITECTURE_BASE_REF"
          --allow-missing-base-baseline
