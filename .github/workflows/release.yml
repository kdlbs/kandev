name: release

# Stable releases are maintainer-dispatched. npm nightlies run from main at
# 12:00 UTC when main has changed since the latest stable npm release.
#
# Flow (one click → everything below):
#   1. prepare           — bump version, regen CHANGELOG, open + merge release PR, push tag vX.Y.Z
#   2. build-web         — build Vite SPA bundle (shared across arches)
#   3. build-bundles     — assemble native bin/ tarballs for 5 platforms
#   4. build-desktop     — package Tauri desktop installers from matching runtime bundles
#   5. docker-{amd64,arm64} — native per-arch image builds (no QEMU), consuming
#                          the prebuilt linux bundles from step 3
#   6. docker-manifest   — stitch the two arch digests into the user-facing
#                          multi-arch tags via `buildx imagetools create`
#   7. docker-universal-{amd64,arm64} — native universal builds on top of
#                          docker-manifest's per-arch base
#   8. docker-universal-manifest — size-gate amd64 staging, then promote both
#                          arches to the user-facing :universal tags
#   9. publish-release   — create GH release with runtime + desktop assets and release notes
#  10. publish-npm       — publish kandev@X.Y.Z + @kdlbs/runtime-*@X.Y.Z to npmjs
#  11. update-homebrew-tap — push updated Formula/kandev.rb to kdlbs/homebrew-kandev
#  12. update-scoop-bucket — push updated bucket/kandev.json to kdlbs/scoop-kandev
#
# npm publishing uses Trusted Publishers (OIDC) — no NPM_TOKEN required.
# Each package (kandev + 5 @kdlbs/runtime-* packages) must have this workflow
# configured as its trusted publisher on npmjs.com (Settings → Publishing access).
#
# Required repository secret for public releases:
#   HOMEBREW_TAP_DEPLOY_KEY — SSH private key for kdlbs/homebrew-kandev deploy key
#   SCOOP_BUCKET_DEPLOY_KEY — SSH private key for kdlbs/scoop-kandev deploy key
# Required configuration in the `release` environment:
#   RELEASE_GPG_PRIVATE_KEY — secret containing the ASCII-armored release tag signing key
#   RELEASE_GPG_FINGERPRINT — variable containing the key's full fingerprint
# Optional configuration in the `release` environment:
#   RELEASE_GPG_PASSPHRASE — secret containing the private key passphrase
# Optional secrets for signed desktop artifacts. If these are incomplete, the
# workflow still builds unsigned desktop artifacts and warns in release notes.
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / KEYCHAIN_PASSWORD — macOS Developer ID signing
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID or APPLE_API_KEY / APPLE_API_ISSUER / APPLE_API_KEY_P8 — macOS notarization
#   WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD — Windows installer signing
#   TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD — updater artifact signing

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        required: true
        type: choice
        default: stable
        options:
          - stable
          - nightly
      bump:
        description: "Stable only: version bump"
        required: true
        type: choice
        default: minor
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Validate selected channel without publishing"
        type: boolean
        default: false
      desktop_validation_only:
        description: "Stable only: build desktop artifacts without publishing"
        type: boolean
        default: false
      backfill_tag:
        description: "Stable only: existing release tag to rebuild/publish"
        required: false
        default: ""
        type: string

# A Stable tag is pushed before its npm job is ready. Serializing whole runs
# prevents a Nightly from using the previous npm baseline during that window.
concurrency:
  group: release-npm-publication
  cancel-in-progress: false
  queue: max

# Default to read-only at the workflow level. Each job opts into the writes
# it actually needs.
permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release (bump version, PR, tag)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' }}
    runs-on: ubuntu-latest
    environment: ${{ (!inputs.dry_run && !inputs.desktop_validation_only && inputs.backfill_tag == '') && 'release' || 'release-validation' }}
    permissions:
      contents: write       # push release branch + tag
      pull-requests: write  # create + merge release PR (required by main ruleset)
    outputs:
      version: ${{ steps.compute.outputs.version }}
      tag: ${{ steps.compute.outputs.tag }}
      ref: ${{ steps.compute.outputs.ref }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Require main for normal release
        if: ${{ !inputs.dry_run && !inputs.desktop_validation_only && inputs.backfill_tag == '' }}
        env:
          CURRENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$CURRENT_REF" != "refs/heads/main" ]; then
            echo "Normal releases must be dispatched from refs/heads/main (got $CURRENT_REF)." >&2
            exit 1
          fi

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: "9.15.9"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"

      - name: Install git-cliff
        env:
          # Pinned to v2.13.1 to match git-cliff-action@v4's default runtime.
          # To bump, also update the sha512 below — fetch the
          # new one from:
          # https://github.com/orhun/git-cliff/releases/download/<tag>/<asset>.sha512
          CLIFF_VERSION: "2.13.1"
          CLIFF_ASSET: "git-cliff-2.13.1-x86_64-unknown-linux-gnu.tar.gz"
          CLIFF_SHA512: "e716cce3a07dda41b1e370d6afbd7a59eb3d4739509fb7856aeec8da2be28c0396584e29e106141c1a1c535c1827dbc1f60417524f5cfb1da9e11f700bd00f30"
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/orhun/git-cliff/releases/download/v${CLIFF_VERSION}/${CLIFF_ASSET}" -o /tmp/git-cliff.tar.gz
          echo "${CLIFF_SHA512}  /tmp/git-cliff.tar.gz" | sha512sum -c -
          tar -xz -C /tmp -f /tmp/git-cliff.tar.gz
          sudo mv "/tmp/git-cliff-${CLIFF_VERSION}/git-cliff" /usr/local/bin/
          rm -rf /tmp/git-cliff.tar.gz "/tmp/git-cliff-${CLIFF_VERSION}"
          git-cliff --version

      - name: Configure git identity
        run: |
          git config user.email "release-bot@kandev"
          git config user.name "kandev release bot"

      - name: Compute next version
        id: compute
        env:
          BACKFILL_TAG: ${{ inputs.backfill_tag }}
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
          DESKTOP_VALIDATION_ONLY: ${{ inputs.desktop_validation_only }}
          CURRENT_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -n "$BACKFILL_TAG" ]; then
            echo "::notice::backfill_tag is set; the 'bump' input ($BUMP) is ignored."
            if [ "$DRY_RUN" = "true" ]; then
              echo "backfill_tag cannot be combined with dry_run." >&2
              exit 1
            fi
            if [ "$DESKTOP_VALIDATION_ONLY" = "true" ]; then
              echo "backfill_tag cannot be combined with desktop_validation_only." >&2
              exit 1
            fi

            case "$BACKFILL_TAG" in
              refs/tags/*) BACKFILL_TAG="${BACKFILL_TAG#refs/tags/}" ;;
            esac

            if [[ ! "$BACKFILL_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "backfill_tag must be a SemVer release tag like v1.2.3." >&2
              exit 1
            fi
            BACKFILL_REF="refs/tags/$BACKFILL_TAG"
            if ! git rev-parse --verify --quiet "${BACKFILL_REF}^{commit}" >/dev/null; then
              echo "backfill_tag does not exist: $BACKFILL_TAG" >&2
              exit 1
            fi

            NEXT="${BACKFILL_TAG#v}"
            LATEST_RELEASE_TAG="$(git tag --list 'v*' | python3 -c "
          import sys, re
          best = None
          best_tag = ''
          for t in (l.strip() for l in sys.stdin if l.strip()):
              s = t.lstrip('v')
              m3 = re.match(r'^(\d+)\.(\d+)\.(\d+)$', s)
              m2 = re.match(r'^(\d+)\.(\d+)$', s)
              if m3:
                  v = tuple(int(x) for x in m3.groups())
                  tag = f'v{v[0]}.{v[1]}.{v[2]}'
              elif m2:
                  v = (int(m2.group(1)), int(m2.group(2)), 0)
                  tag = f'v{v[0]}.{v[1]}.{v[2]}'
              else:
                  continue
              if best is None or v > best:
                  best = v
                  best_tag = tag
          print(best_tag)
          ")"
            if [ -z "$LATEST_RELEASE_TAG" ]; then
              echo "backfill_tag cannot be used: no existing release tags found." >&2
              exit 1
            fi
            if [ "$LATEST_RELEASE_TAG" != "$BACKFILL_TAG" ]; then
              echo "backfill_tag must be the latest release tag ($LATEST_RELEASE_TAG) because backfill publishes mutable channels." >&2
              exit 1
            fi

            BACKFILL_REF="$BACKFILL_REF" BACKFILL_TAG="$BACKFILL_TAG" NEXT="$NEXT" node <<'NODE'
            const { execFileSync } = require("node:child_process");

            const tag = process.env.BACKFILL_TAG;
            const ref = process.env.BACKFILL_REF;
            const next = process.env.NEXT;
            const show = (path) => execFileSync("git", ["show", `${ref}:${path}`], { encoding: "utf8" });
            const versions = new Map([
              ["apps/cli/package.json", JSON.parse(show("apps/cli/package.json")).version],
              ["apps/desktop/package.json", JSON.parse(show("apps/desktop/package.json")).version],
              ["apps/desktop/src-tauri/tauri.conf.json", JSON.parse(show("apps/desktop/src-tauri/tauri.conf.json")).version],
              ["apps/desktop/src-tauri/Cargo.toml", show("apps/desktop/src-tauri/Cargo.toml").match(/^version = "([^"]+)"/m)?.[1]],
              [
                "apps/desktop/src-tauri/Cargo.lock",
                show("apps/desktop/src-tauri/Cargo.lock").match(/\[\[package\]\]\nname = "kandev-desktop"\nversion = "([^"]+)"/)?.[1],
              ],
            ]);

            for (const [path, version] of versions) {
              if (version !== next) {
                console.error(`backfill_tag version mismatch: ${tag} points to ${path} version ${version ?? "<missing>"} (expected ${next}).`);
                process.exit(1);
              }
            }
          NODE

            TAG="$BACKFILL_TAG"
            echo "Backfill existing release tag: $TAG"
            echo "Next version:                 $NEXT"
            echo "version=$NEXT" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
            echo "ref=$BACKFILL_REF" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PKG_VERSION="$(node -p "require('./apps/cli/package.json').version")"

          # Find latest git tag, normalizing legacy two-part tags (vM.m → M.m.0)
          LATEST_TAG="$(git tag --list 'v*' | python3 -c "
          import sys, re
          best = (0, 0, 0)
          for t in (l.strip() for l in sys.stdin if l.strip()):
              s = t.lstrip('v')
              m3 = re.match(r'^(\d+)\.(\d+)\.(\d+)$', s)
              m2 = re.match(r'^(\d+)\.(\d+)$', s)
              if m3:
                  v = tuple(int(x) for x in m3.groups())
              elif m2:
                  v = (int(m2.group(1)), int(m2.group(2)), 0)
              else:
                  continue
              if v > best:
                  best = v
          print(f'{best[0]}.{best[1]}.{best[2]}')
          ")"

          # Use the higher of package.json version and the latest tag as baseline
          BASELINE="$(python3 -c "
          a = '$PKG_VERSION'.split('.')
          b = '$LATEST_TAG'.split('.')
          ai = tuple(int(x) for x in a)
          bi = tuple(int(x) for x in b)
          print('$PKG_VERSION' if ai >= bi else '$LATEST_TAG')
          ")"

          IFS=. read -r MAJ MIN PAT <<<"$BASELINE"
          case "$BUMP" in
            patch) NEXT="${MAJ}.${MIN}.$((PAT + 1))" ;;
            minor) NEXT="${MAJ}.$((MIN + 1)).0" ;;
            major) NEXT="$((MAJ + 1)).0.0" ;;
            *) echo "Invalid bump '$BUMP'" >&2; exit 1 ;;
          esac

          TAG="v${NEXT}"
          echo "Current package.json version: $PKG_VERSION"
          echo "Latest git tag (normalized):  $LATEST_TAG"
          echo "Baseline:                     $BASELINE"
          echo "Bump:                         $BUMP"
          echo "Next version:                 $NEXT"
          echo "Next tag:                     $TAG"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [ "$DESKTOP_VALIDATION_ONLY" = "true" ]; then
            echo "ref=$CURRENT_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          fi

          # Sanity: tag must not already exist
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally" >&2
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "Tag $TAG already exists on origin" >&2
            exit 1
          fi

      - name: Validate committed release signing public key
        id: committed_release_gpg
        if: ${{ !inputs.dry_run && !inputs.desktop_validation_only && inputs.backfill_tag == '' }}
        run: |
          set -euo pipefail
          KEY_LISTING="$(gpg --batch --with-colons --show-keys .github/release-signing-key.asc)"
          SECRET_KEY_RECORDS="$(printf '%s\n' "$KEY_LISTING" | awk -F: '$1 == "sec" || $1 == "ssb" { count++ } END { print count + 0 }')"
          PUBLIC_KEY_RECORDS="$(printf '%s\n' "$KEY_LISTING" | awk -F: '$1 == "pub" { count++ } END { print count + 0 }')"
          PRIMARY_FINGERPRINTS="$(printf '%s\n' "$KEY_LISTING" | awk -F: '
            $1 == "pub" {
              if (getline && $1 == "fpr") print $10
            }
          ')"
          PRIMARY_FINGERPRINT_COUNT="$(printf '%s\n' "$PRIMARY_FINGERPRINTS" | awk 'NF { count++ } END { print count + 0 }')"

          if [ "$SECRET_KEY_RECORDS" -ne 0 ]; then
            echo ".github/release-signing-key.asc must not contain secret-key material." >&2
            exit 1
          fi
          if [ "$PUBLIC_KEY_RECORDS" -eq 0 ]; then
            echo ".github/release-signing-key.asc must contain one primary public key; none found." >&2
            exit 1
          fi
          if [ "$PUBLIC_KEY_RECORDS" -ne 1 ] || [ "$PRIMARY_FINGERPRINT_COUNT" -ne 1 ]; then
            echo ".github/release-signing-key.asc must contain exactly one primary public key and fingerprint." >&2
            exit 1
          fi

          PUBLIC_FINGERPRINT="$PRIMARY_FINGERPRINTS"
          if ! [[ "$PUBLIC_FINGERPRINT" =~ ^[A-F0-9]{40}$ ]]; then
            echo ".github/release-signing-key.asc contains an invalid primary public-key fingerprint." >&2
            exit 1
          fi
          echo "fingerprint=$PUBLIC_FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Preflight release tag signing fingerprint
        if: ${{ !inputs.dry_run && !inputs.desktop_validation_only && inputs.backfill_tag == '' }}
        env:
          EXPECTED_FINGERPRINT: ${{ vars.RELEASE_GPG_FINGERPRINT }}
          COMMITTED_PUBLIC_FINGERPRINT: ${{ steps.committed_release_gpg.outputs.fingerprint }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_FINGERPRINT" ]; then
            echo "RELEASE_GPG_FINGERPRINT is required as a variable in the release environment." >&2
            exit 1
          fi
          if [ -z "$COMMITTED_PUBLIC_FINGERPRINT" ]; then
            echo "The committed release public key did not report a fingerprint." >&2
            exit 1
          fi
          if [ "$COMMITTED_PUBLIC_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "The committed release public key does not match RELEASE_GPG_FINGERPRINT." >&2
            exit 1
          fi

      - name: Bump version + generate CHANGELOG (in working tree)
        if: ${{ !inputs.dry_run && !inputs.desktop_validation_only && inputs.backfill_tag == '' }}
        env:
          NEXT: ${{ steps.compute.outputs.version }}
          TAG: ${{ steps.compute.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Bump only the main package version. optionalDependencies stay
          # pinned to 0.0.0-bootstrap in committed source — publish-npm.sh
          # rewrites them to the real version in-flight before publishing,
          # once the matching @kdlbs/runtime-* tarballs exist on npm.
          (cd apps/cli && npm version --no-git-tag-version "$NEXT")
          (cd apps/desktop && npm version --no-git-tag-version "$NEXT")
          node <<'NODE'
          const fs = require("node:fs");
          const next = process.env.NEXT;

          const tauriConfigPath = "apps/desktop/src-tauri/tauri.conf.json";
          const tauriConfig = JSON.parse(fs.readFileSync(tauriConfigPath, "utf8"));
          tauriConfig.version = next;
          fs.writeFileSync(tauriConfigPath, `${JSON.stringify(tauriConfig, null, 2)}\n`);

          const cargoTomlPath = "apps/desktop/src-tauri/Cargo.toml";
          const cargoToml = fs.readFileSync(cargoTomlPath, "utf8");
          fs.writeFileSync(cargoTomlPath, cargoToml.replace(/^version = ".*"$/m, `version = "${next}"`));

          const cargoLockPath = "apps/desktop/src-tauri/Cargo.lock";
          const cargoLock = fs.readFileSync(cargoLockPath, "utf8");
          const packageBlock = /(\[\[package\]\]\nname = "kandev-desktop"\nversion = ")[^"]+(")/;
          if (!packageBlock.test(cargoLock)) {
            throw new Error("Could not find kandev-desktop package entry in Cargo.lock");
          }
          fs.writeFileSync(cargoLockPath, cargoLock.replace(packageBlock, `$1${next}$2`));
          NODE
          pnpm -C apps install --no-frozen-lockfile
          git-cliff --tag "$TAG" -o CHANGELOG.md

      - name: Create release PR
        id: release_pr
        if: ${{ !inputs.dry_run && !inputs.desktop_validation_only && inputs.backfill_tag == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT: ${{ steps.compute.outputs.version }}
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          set -euo pipefail
          # main is protected by a ruleset that requires PRs, so we go through
          # a release branch and administrator-merged PR instead of pushing directly.
          BRANCH="release/$TAG"
          MSG="release: publish $NEXT"

          git checkout -b "$BRANCH"
          git add apps/cli/package.json apps/desktop/package.json apps/desktop/src-tauri/Cargo.lock apps/desktop/src-tauri/Cargo.toml apps/desktop/src-tauri/tauri.conf.json CHANGELOG.md apps/pnpm-lock.yaml
          git commit -m "$MSG"
          # If a previous run pushed this branch but failed before the merge
          # landed, the remote branch still exists. Delete it so the push
          # below is a clean -u origin "$BRANCH" rather than a non-fast-forward
          # rejection. Closing the corresponding stale PR (if any) happens
          # automatically when GitHub sees the head branch deleted.
          git push origin --delete "$BRANCH" 2>/dev/null || true
          git push -u origin "$BRANCH"

          HEAD_SHA="$(git rev-parse HEAD)"
          PR_URL="$(gh pr create \
            --title "$MSG" \
            --body "Automated release: \`$NEXT\`" \
            --head "$BRANCH" \
            --base main)"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Merge release PR with administrator token
        if: ${{ !inputs.dry_run && !inputs.desktop_validation_only && inputs.backfill_tag == '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_BYPASS_TOKEN }}
          PR_URL: ${{ steps.release_pr.outputs.url }}
          EXPECTED_HEAD: ${{ steps.release_pr.outputs.head }}
          MSG: "release: publish ${{ steps.compute.outputs.version }}"
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASE_PR_BYPASS_TOKEN is required in the release environment." >&2
            exit 1
          fi
          gh pr merge "$PR_URL" \
            --admin \
            --squash \
            --match-head-commit "$EXPECTED_HEAD" \
            --subject "$MSG" \
            --body ""

      - name: Select merged release commit
        if: ${{ !inputs.dry_run && !inputs.desktop_validation_only && inputs.backfill_tag == '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.release_pr.outputs.url }}
          EXPECTED_HEAD: ${{ steps.release_pr.outputs.head }}
        run: |
          set -euo pipefail
          PR_JSON="$(gh pr view "$PR_URL" --json state,mergedAt,mergeCommit,headRefOid)"
          PR_STATE="$(jq -r '.state' <<<"$PR_JSON")"
          MERGED_AT="$(jq -r '.mergedAt // empty' <<<"$PR_JSON")"
          PR_HEAD="$(jq -r '.headRefOid' <<<"$PR_JSON")"
          MERGE_COMMIT="$(jq -r '.mergeCommit.oid // empty' <<<"$PR_JSON")"

          if [ "$PR_STATE" != "MERGED" ] || [ -z "$MERGED_AT" ]; then
            echo "The release pull request did not merge." >&2
            exit 1
          fi
          if [ "$PR_HEAD" != "$EXPECTED_HEAD" ]; then
            echo "The merged release pull request head does not match the expected commit." >&2
            exit 1
          fi
          if ! [[ "$MERGE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The release pull request did not report a valid merge commit." >&2
            exit 1
          fi

          # Pull the squashed commit into local main. The signing key is not
          # imported until all repository-controlled release work is complete.
          git fetch origin main
          if ! git merge-base --is-ancestor "$MERGE_COMMIT" origin/main; then
            echo "The reported release merge commit is not on origin/main." >&2
            exit 1
          fi
          git checkout --detach "$MERGE_COMMIT"

      - name: Validate merged release signing public key
        id: merged_release_gpg
        if: ${{ !inputs.dry_run && !inputs.desktop_validation_only && inputs.backfill_tag == '' }}
        run: |
          set -euo pipefail
          KEY_LISTING="$(gpg --batch --with-colons --show-keys .github/release-signing-key.asc)"
          SECRET_KEY_RECORDS="$(printf '%s\n' "$KEY_LISTING" | awk -F: '$1 == "sec" || $1 == "ssb" { count++ } END { print count + 0 }')"
          PUBLIC_KEY_RECORDS="$(printf '%s\n' "$KEY_LISTING" | awk -F: '$1 == "pub" { count++ } END { print count + 0 }')"
          PRIMARY_FINGERPRINTS="$(printf '%s\n' "$KEY_LISTING" | awk -F: '
            $1 == "pub" {
              if (getline && $1 == "fpr") print $10
            }
          ')"
          PRIMARY_FINGERPRINT_COUNT="$(printf '%s\n' "$PRIMARY_FINGERPRINTS" | awk 'NF { count++ } END { print count + 0 }')"

          if [ "$SECRET_KEY_RECORDS" -ne 0 ]; then
            echo ".github/release-signing-key.asc must not contain secret-key material." >&2
            exit 1
          fi
          if [ "$PUBLIC_KEY_RECORDS" -eq 0 ]; then
            echo ".github/release-signing-key.asc must contain one primary public key; none found." >&2
            exit 1
          fi
          if [ "$PUBLIC_KEY_RECORDS" -ne 1 ] || [ "$PRIMARY_FINGERPRINT_COUNT" -ne 1 ]; then
            echo ".github/release-signing-key.asc must contain exactly one primary public key and fingerprint." >&2
            exit 1
          fi

          PUBLIC_FINGERPRINT="$PRIMARY_FINGERPRINTS"
          if ! [[ "$PUBLIC_FINGERPRINT" =~ ^[A-F0-9]{40}$ ]]; then
            echo ".github/release-signing-key.asc contains an invalid primary public-key fingerprint." >&2
            exit 1
          fi
          echo "fingerprint=$PUBLIC_FINGERPRINT" >> "$GITHUB_OUTPUT"

      - name: Import release tag signing key
        id: import_release_gpg
        if: ${{ !inputs.dry_run && !inputs.desktop_validation_only && inputs.backfill_tag == '' }}
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        with:
          gpg_private_key: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
          git_user_signingkey: true
          git_tag_gpgsign: true

      - name: Validate release tag signing identity
        if: ${{ !inputs.dry_run && !inputs.desktop_validation_only && inputs.backfill_tag == '' }}
        env:
          EXPECTED_FINGERPRINT: ${{ vars.RELEASE_GPG_FINGERPRINT }}
          MERGED_PUBLIC_FINGERPRINT: ${{ steps.merged_release_gpg.outputs.fingerprint }}
          IMPORTED_FINGERPRINT: ${{ steps.import_release_gpg.outputs.fingerprint }}
          TAGGER_NAME: ${{ steps.import_release_gpg.outputs.name }}
          TAGGER_EMAIL: ${{ steps.import_release_gpg.outputs.email }}
        run: |
          set -euo pipefail
          if [ -z "$EXPECTED_FINGERPRINT" ]; then
            echo "RELEASE_GPG_FINGERPRINT is required in the release environment." >&2
            exit 1
          fi
          if [ -z "$MERGED_PUBLIC_FINGERPRINT" ]; then
            echo "The merged release public key did not report a fingerprint." >&2
            exit 1
          fi
          if [ "$MERGED_PUBLIC_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "The merged release public key does not match RELEASE_GPG_FINGERPRINT." >&2
            exit 1
          fi
          if [ -z "$IMPORTED_FINGERPRINT" ]; then
            echo "The imported release signing key did not report a fingerprint." >&2
            exit 1
          fi
          if [ "$IMPORTED_FINGERPRINT" != "$MERGED_PUBLIC_FINGERPRINT" ]; then
            echo "The imported release signing key does not match the merged release public key." >&2
            exit 1
          fi
          if [ "$IMPORTED_FINGERPRINT" != "$EXPECTED_FINGERPRINT" ]; then
            echo "The imported release signing key does not match RELEASE_GPG_FINGERPRINT." >&2
            exit 1
          fi
          if [ -z "$TAGGER_NAME" ] || [ -z "$TAGGER_EMAIL" ]; then
            echo "The validated release signing key must contain a tagger name and email." >&2
            exit 1
          fi
          git config user.name "$TAGGER_NAME"
          git config user.email "$TAGGER_EMAIL"
          git config user.signingkey "$IMPORTED_FINGERPRINT"

      - name: Create and push signed release tag
        if: ${{ !inputs.dry_run && !inputs.desktop_validation_only && inputs.backfill_tag == '' }}
        env:
          NEXT: ${{ steps.compute.outputs.version }}
          TAG: ${{ steps.compute.outputs.tag }}
        run: |
          set -euo pipefail
          MERGE_COMMIT="$(git rev-parse HEAD)"
          echo "Release merge commit: $MERGE_COMMIT"
          git tag -s "$TAG" -m "release: $NEXT"
          git tag -v "$TAG"

          # Tag push: retry once for transient network blips. If both attempts
          # fail, main already has the bumped commit but no tag exists.
          git push origin "$TAG" || {
            echo "Tag push failed; retrying in 5s..." >&2
            sleep 5
            git push origin "$TAG" || {
              echo "ERROR: Tag push failed twice after PR merge succeeded." >&2
              echo "  Release merge commit: $MERGE_COMMIT" >&2
              echo "  Recover only with the configured release signing identity:" >&2
              echo "    git checkout --detach $MERGE_COMMIT" >&2
              echo "    git tag -s $TAG -m 'release: $NEXT'" >&2
              echo "    git tag -v $TAG" >&2
              echo "  Confirm the verified full fingerprint matches RELEASE_GPG_FINGERPRINT, then:" >&2
              echo "    git push origin $TAG" >&2
              exit 1
            }
          }

      - name: Desktop validation summary
        if: ${{ !inputs.dry_run && inputs.desktop_validation_only }}
        env:
          NEXT: ${{ steps.compute.outputs.version }}
          TAG: ${{ steps.compute.outputs.tag }}
          REF: ${{ steps.compute.outputs.ref }}
        run: |
          echo "Desktop validation for $TAG / $NEXT."
          echo "Desktop signing is automatic: complete signing inputs produce signed artifacts; otherwise artifacts are unsigned."
          echo "No release PR, tag, GitHub release, public container tags, npm publish, or Homebrew update will be created."
          echo "Build jobs will check out $REF."

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        env:
          NEXT: ${{ steps.compute.outputs.version }}
          TAG: ${{ steps.compute.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # In dry-run we still bump + run git-cliff locally so the maintainer
          # can verify the computed version + changelog look right, but nothing
          # is committed or pushed.
          (cd apps/cli && npm version --no-git-tag-version "$NEXT")
          pnpm -C apps install --no-frozen-lockfile
          git-cliff --tag "$TAG" -o CHANGELOG.md
          echo
          echo "DRY RUN: Would have created + merged release PR and tagged $TAG."
          echo "DRY RUN: apps/cli/package.json bumped to $NEXT (in-runner only)."
          echo "DRY RUN: CHANGELOG.md regenerated (in-runner only)."

  nightly-prepare:
    name: Prepare npm nightly metadata
    if: >-
      ${{
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.channel == 'nightly')
      }}
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.metadata.outputs.should_publish }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
      ref: ${{ steps.metadata.outputs.ref }}
      stable_version: ${{ steps.metadata.outputs.stable_version }}
      nightly_version_at_start: ${{ steps.metadata.outputs.nightly_version_at_start }}
      nightly_tags_at_start: ${{ steps.metadata.outputs.nightly_tags_at_start }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Validate manual Nightly request
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          CURRENT_REF: ${{ github.ref }}
          DESKTOP_VALIDATION_ONLY: ${{ inputs.desktop_validation_only }}
          BACKFILL_TAG: ${{ inputs.backfill_tag }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          if [ "$CURRENT_REF" != "refs/heads/main" ]; then
            echo "Manual Nightlies must be dispatched from refs/heads/main (got $CURRENT_REF)." >&2
            exit 1
          fi
          if [ "$DESKTOP_VALIDATION_ONLY" = "true" ]; then
            echo "desktop_validation_only cannot be combined with channel=nightly." >&2
            exit 1
          fi
          if [ -n "$BACKFILL_TAG" ]; then
            echo "backfill_tag cannot be combined with channel=nightly." >&2
            exit 1
          fi
          echo "::notice::The Stable-only bump input ($BUMP) is ignored for Nightly."

      - name: Resolve nightly metadata
        id: metadata
        run: |
          bash scripts/release/nightly-release.sh prepare \
            --scheduled-sha "${{ github.sha }}" \
            --output "$GITHUB_OUTPUT"

      - name: Nightly dry-run summary
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          SHOULD_PUBLISH: ${{ steps.metadata.outputs.should_publish }}
          VERSION: ${{ steps.metadata.outputs.version }}
          REF: ${{ steps.metadata.outputs.ref }}
        run: |
          if [ "$SHOULD_PUBLISH" = "true" ]; then
            echo "DRY RUN: Would publish $VERSION from $REF under npm's nightly dist-tag."
          else
            echo "DRY RUN: Nightly preflight found no eligible publication."
          fi
          echo "DRY RUN: No bundles were built and npm was not changed."

  build-web:
    name: Build web SPA
    needs: [prepare, nightly-prepare]
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && needs.prepare.result == 'success' && !inputs.dry_run) ||
        ((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'nightly' && !inputs.dry_run)) && needs.nightly-prepare.result == 'success' && needs.nightly-prepare.outputs.should_publish == 'true')
      ) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.nightly-prepare.result == 'success' && needs.nightly-prepare.outputs.ref || needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: "9.15.9"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm -C apps install --frozen-lockfile
      - name: Build web (Vite)
        env:
          KANDEV_VERSION: ${{ needs.nightly-prepare.result == 'success' && needs.nightly-prepare.outputs.tag || needs.prepare.outputs.tag }}
          VITE_KANDEV_API_PORT: ""
          VITE_KANDEV_DEBUG: ""
        run: pnpm -C apps --filter @kandev/web build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-bundle
          path: apps/web/dist
          include-hidden-files: true

  build-bundles:
    name: Build platform bundle (${{ matrix.platform }})
    needs: [prepare, nightly-prepare, build-web]
    if: >-
      ${{ !cancelled() && needs.build-web.result == 'success' && (
        (github.event_name == 'workflow_dispatch' && inputs.channel == 'stable' && needs.prepare.result == 'success' && !inputs.dry_run) ||
        ((github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'nightly' && !inputs.dry_run)) && needs.nightly-prepare.result == 'success' && needs.nightly-prepare.outputs.should_publish == 'true')
      ) }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            platform: linux-arm64
            goos: linux
            goarch: arm64
          - os: macos-14
            platform: macos-x64
            goos: darwin
            goarch: amd64
          - os: macos-14
            platform: macos-arm64
            goos: darwin
            goarch: arm64
          - os: ubuntu-latest
            platform: windows-x64
            goos: windows
            goarch: amd64
            cc: x86_64-w64-mingw32-gcc
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: 1
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.nightly-prepare.result == 'success' && needs.nightly-prepare.outputs.ref || needs.prepare.outputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: apps/backend/go.mod
          cache-dependency-path: apps/backend/go.sum
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-bundle
          path: apps/backend/internal/webapp/embedded/generated

      - name: Install cross-compilation tools
        if: matrix.cc
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      # The `fts5` build tag is REQUIRED on the kandev binary. The office
      # task search migrations create a `tasks_fts` virtual table using
      # `USING fts5(...)`; without the tag, mattn/go-sqlite3 lacks the
      # module and any subsequent boot against a DB that already has the
      # virtual table fails with "no such module: fts5" during schema init.
      # See issue #1006 for the regression this prevents.
      #
      # Version ldflags mirror apps/backend/Makefile so `kandev --version`
      # reports the released tag instead of the build-time default "dev".
      - name: Build backend binaries
        env:
          CC: ${{ matrix.cc || '' }}
          KANDEV_VERSION: ${{ needs.nightly-prepare.result == 'success' && needs.nightly-prepare.outputs.tag || needs.prepare.outputs.tag }}
        run: |
          test -f apps/backend/internal/webapp/embedded/generated/index.html
          cd apps/backend
          mkdir -p bin
          EXT=${{ matrix.goos == 'windows' && '.exe' || '' }}
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_TIME=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          LDFLAGS="-s -w -X main.Version=${KANDEV_VERSION} -X main.Commit=${COMMIT} -X main.BuildTime=${BUILD_TIME}"
          # Export to subsequent steps so the cross-compiled agentctl helper
          # below gets the same version metadata (matches Makefile parity).
          echo "LDFLAGS=${LDFLAGS}" >> "${GITHUB_ENV}"
          go build -tags fts5 -ldflags "${LDFLAGS}" -o bin/kandev${EXT} ./cmd/kandev
          go build -ldflags "${LDFLAGS}" -o bin/agentctl${EXT} ./cmd/agentctl

      # Cross-compile remote agentctl helpers regardless of the host platform.
      # Remote executors upload or bind-mount these sidecars into Linux and
      # macOS SSH hosts. CGO is off so this works from any host without extra
      # toolchain setup.
      - name: Build remote agentctl helpers
        run: |
          cd apps/backend
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 CC= go build -ldflags "${LDFLAGS}" -o bin/agentctl-linux-amd64 ./cmd/agentctl
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 CC= go build -ldflags "${LDFLAGS}" -o bin/agentctl-linux-arm64 ./cmd/agentctl
          # darwin/arm64 is ad-hoc-signed by the Go linker at link time, which is
          # what Apple Silicon (AMFI) requires; bundle validation enforces it.
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 CC= go build -ldflags "${LDFLAGS}" -o bin/agentctl-darwin-arm64 ./cmd/agentctl
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 CC= go build -ldflags "${LDFLAGS}" -o bin/agentctl-darwin-amd64 ./cmd/agentctl

      - name: Package bundle
        run: |
          rm -rf dist/kandev
          mkdir -p dist/kandev/bin
          EXT=${{ matrix.goos == 'windows' && '.exe' || '' }}
          cp apps/backend/bin/kandev${EXT} dist/kandev/bin/
          cp apps/backend/bin/agentctl${EXT} dist/kandev/bin/
          cp apps/backend/bin/agentctl-linux-amd64 dist/kandev/bin/
          cp apps/backend/bin/agentctl-linux-arm64 dist/kandev/bin/
          cp apps/backend/bin/agentctl-darwin-arm64 dist/kandev/bin/
          cp apps/backend/bin/agentctl-darwin-amd64 dist/kandev/bin/
          bash scripts/release/package-bundle.sh --bundle-dir dist/kandev
          cd dist
          tar -czf "kandev-${{ matrix.platform }}.tar.gz" kandev
          shasum -a 256 "kandev-${{ matrix.platform }}.tar.gz" > "kandev-${{ matrix.platform }}.tar.gz.sha256"
          # Windows package managers cannot consume the tarball: winget's
          # InstallerType enum accepts zip as its only archive format, and
          # Chocolatey's unzip helper needs two 7-Zip passes for a .tar.gz.
          # The zip is published alongside the tarball, not instead of it —
          # Homebrew and the npm runtime packages still read the tarball.
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -qr "kandev-${{ matrix.platform }}.zip" kandev
            shasum -a 256 "kandev-${{ matrix.platform }}.zip" > "kandev-${{ matrix.platform }}.zip.sha256"
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.platform }}
          # The zip entries match nothing on the four non-Windows platforms.
          # if-no-files-found is left at its default so a missing tarball is
          # still an error.
          path: |
            dist/kandev-${{ matrix.platform }}.tar.gz
            dist/kandev-${{ matrix.platform }}.tar.gz.sha256
            dist/kandev-${{ matrix.platform }}.zip
            dist/kandev-${{ matrix.platform }}.zip.sha256

  build-desktop:
    name: Build desktop app (${{ matrix.platform }})
    needs: [prepare, build-bundles]
    if: >-
      ${{ !cancelled() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.channel == 'stable' &&
        !inputs.dry_run &&
        needs.prepare.result == 'success' &&
        needs.build-bundles.result == 'success'
      }}
    strategy:
      matrix:
        include:
          - platform: macos-arm64
            os: macos-15
            rust_target: aarch64-apple-darwin
            tauri_bundles: dmg
          - platform: macos-x64
            os: macos-15-intel
            rust_target: x86_64-apple-darwin
            tauri_bundles: dmg
          - platform: linux-x64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
            tauri_bundles: appimage,deb,rpm
          - platform: linux-arm64
            os: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            tauri_bundles: appimage,deb,rpm
          - platform: windows-x64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc
            tauri_bundles: nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - name: Prepare desktop asset verifier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/verify-desktop-assets.sh"
          gh api \
            --header "Accept: application/vnd.github.raw+json" \
            "repos/${{ github.repository }}/contents/scripts/release/verify-desktop-assets.sh?ref=${{ github.workflow_sha }}" \
            > "$helper"
          echo "DESKTOP_ASSET_VERIFIER=$helper" >> "$GITHUB_ENV"

      - name: Prepare macOS desktop diagnostics helper
        if: startsWith(matrix.platform, 'macos-')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/collect-macos-desktop-diagnostics.sh"
          mkdir -p "$(dirname "$helper")"
          if [ -f "$GITHUB_WORKSPACE/.github/scripts/collect-macos-desktop-diagnostics.sh" ]; then
            cp "$GITHUB_WORKSPACE/.github/scripts/collect-macos-desktop-diagnostics.sh" "$helper"
          else
            encoded_helper="$RUNNER_TEMP/collect-macos-desktop-diagnostics.sh.b64"
            gh api \
              "repos/${{ github.repository }}/contents/.github/scripts/collect-macos-desktop-diagnostics.sh?ref=${{ github.workflow_sha }}" \
              --jq .content > "$encoded_helper"
            HELPER="$helper" ENCODED_HELPER="$encoded_helper" python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          encoded = Path(os.environ["ENCODED_HELPER"]).read_text()
          Path(os.environ["HELPER"]).write_bytes(base64.b64decode(encoded))
          PY
          fi
          chmod +x "$helper"
          echo "DESKTOP_DIAGNOSTICS_SCRIPT=$helper" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: "9.15.9"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --target "${{ matrix.rust_target }}"

      - name: Cache Rust build
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: desktop-${{ matrix.platform }}-${{ matrix.rust_target }}

      - name: Install Linux desktop dependencies
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libglib2.0-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            patchelf
          command -v xdg-open

      - name: Install dependencies
        run: pnpm -C apps install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-${{ matrix.platform }}
          path: dist/desktop-runtime

      - name: Prepare desktop runtime resources
        run: |
          set -euo pipefail
          mkdir -p dist/desktop-runtime-src
          tar -xzf "dist/desktop-runtime/kandev-${{ matrix.platform }}.tar.gz" -C dist/desktop-runtime-src
          scripts/release/prepare-desktop-runtime.sh \
            --bundle-dir "dist/desktop-runtime-src/kandev" \
            --platform "${{ matrix.platform }}" \
            --output-dir "apps/desktop/src-tauri/resources/kandev"

      - name: Configure macOS signing and notarization
        if: startsWith(matrix.platform, 'macos-')
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail

          if ! bash scripts/release/desktop-signing-ready.sh macos >/dev/null 2>&1; then
            echo "MACOS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "::notice::macOS signing/notarization inputs are incomplete; building unsigned desktop artifact."
            exit 0
          fi

          certificate_path="$RUNNER_TEMP/kandev-developer-id.p12"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["RUNNER_TEMP"], "kandev-developer-id.p12").write_bytes(
              base64.b64decode(os.environ["APPLE_CERTIFICATE"])
          )
          PY

          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import "$certificate_path" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          cert_info="$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application" | head -n 1 || true)"
          if [ -z "$cert_info" ]; then
            cert_info="$(security find-identity -v -p codesigning build.keychain | head -n 1 || true)"
          fi
          if [ -z "$cert_info" ]; then
            echo "::error::No code signing identity found in build.keychain" >&2
            exit 1
          fi
          cert_id="$(echo "$cert_info" | awk -F'"' '{print $2}')"
          echo "APPLE_SIGNING_IDENTITY=$cert_id" >> "$GITHUB_ENV"
          echo "MACOS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"

          if [ -n "${APPLE_API_KEY:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ] && [ -n "${APPLE_API_KEY_P8:-}" ]; then
            private_keys_dir="$RUNNER_TEMP/private_keys"
            mkdir -p "$private_keys_dir"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$private_keys_dir/AuthKey_${APPLE_API_KEY}.p8"
            echo "APPLE_API_KEY_PATH=$private_keys_dir/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
          fi

      - name: Sign macOS desktop runtime binaries
        if: startsWith(matrix.platform, 'macos-') && env.MACOS_SIGNING_ENABLED == 'true'
        run: |
          set -euo pipefail
          runtime_bin="apps/desktop/src-tauri/resources/kandev/bin"
          for binary in kandev agentctl agentctl-darwin-arm64 agentctl-darwin-amd64; do
            path="$runtime_bin/$binary"
            if [ ! -f "$path" ]; then
              echo "::error::Missing macOS runtime binary at $path" >&2
              exit 1
            fi
            codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$path"
            codesign --verify --strict --verbose=2 "$path"
          done

      - name: Detect Windows signing inputs
        if: matrix.platform == 'windows-x64'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if bash scripts/release/desktop-signing-ready.sh windows >/dev/null 2>&1; then
            echo "WINDOWS_SIGNING_ENABLED=true" >> "$GITHUB_ENV"
          else
            echo "WINDOWS_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "::notice::Windows signing inputs are incomplete; building unsigned desktop artifact."
          fi

      - name: Sign Windows desktop runtime binaries
        if: matrix.platform == 'windows-x64' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          WINDOWS_SIGNTOOL_PATH: ${{ secrets.WINDOWS_SIGNTOOL_PATH }}
        run: |
          $runtimeBin = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/resources/kandev/bin"
          foreach ($binary in @("kandev.exe", "agentctl.exe")) {
            $path = Join-Path $runtimeBin $binary
            if (!(Test-Path -LiteralPath $path)) {
              Write-Error "Missing Windows runtime binary at $path"
              exit 1
            }
            & "$env:GITHUB_WORKSPACE/apps/desktop/src-tauri/windows-sign.ps1" -Path $path
          }

      - name: Detect Tauri updater signing input
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "UPDATER_SIGNING_ENABLED=false" >> "$GITHUB_ENV"
            echo "::notice::Tauri updater signing key is absent; signed updater artifacts and latest.json will be skipped."
            exit 0
          fi
          helper="$RUNNER_TEMP/updater-signing-ready.sh"
          gh api \
            --header "Accept: application/vnd.github.raw+json" \
            "repos/${{ github.repository }}/contents/scripts/release/updater-signing-ready.sh?ref=${{ github.workflow_sha }}" \
            > "$helper"
          if ! bash "$helper" "${{ matrix.platform }}"; then
            echo "::error::Updater signing prerequisites failed for ${{ matrix.platform }}." >&2
            exit 1
          fi
          echo "UPDATER_SIGNING_ENABLED=true" >> "$GITHUB_ENV"

      - name: Build Tauri desktop app
        timeout-minutes: 70
        env:
          CI: "true"
          DESKTOP_DIAGNOSTICS_PLATFORM: ${{ matrix.platform }}
          DESKTOP_DIAGNOSTICS_RUST_TARGET: ${{ matrix.rust_target }}
          TAURI_BUNDLE_ATTEMPTS: ${{ startsWith(matrix.platform, 'macos-') && '2' || '1' }}
          TAURI_BUILD_TIMEOUT_SECONDS: ${{ startsWith(matrix.platform, 'macos-') && '1800' || '0' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          WINDOWS_SIGNTOOL_PATH: ${{ secrets.WINDOWS_SIGNTOOL_PATH }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${MACOS_SIGNING_ENABLED:-false}" != "true" ]; then
            unset APPLE_CERTIFICATE
            unset APPLE_CERTIFICATE_PASSWORD
            unset APPLE_ID
            unset APPLE_PASSWORD
            unset APPLE_TEAM_ID
            unset APPLE_PROVIDER_SHORT_NAME
            unset APPLE_API_KEY
            unset APPLE_API_ISSUER
            unset APPLE_API_KEY_PATH
            unset APPLE_SIGNING_IDENTITY
          fi
          if [ "${WINDOWS_SIGNING_ENABLED:-false}" != "true" ]; then
            unset WINDOWS_CERTIFICATE
            unset WINDOWS_CERTIFICATE_PASSWORD
            unset WINDOWS_TIMESTAMP_URL
            unset WINDOWS_SIGNTOOL_PATH
          fi
          tauri_bundles="${{ matrix.tauri_bundles }}"
          updater_config='{"bundle":{"createUpdaterArtifacts":false}}'
          if [ "${UPDATER_SIGNING_ENABLED:-false}" = "true" ]; then
            updater_config='{"bundle":{"createUpdaterArtifacts":"v1Compatible"}}'
            if [[ "${{ matrix.platform }}" == macos-* ]]; then
              # Tauri derives the macOS updater archive from the app bundle.
              tauri_bundles="${tauri_bundles},app"
            fi
          else
            unset TAURI_SIGNING_PRIVATE_KEY
            unset TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          fi
          pnpm -C apps --filter @kandev/desktop build:vite
          cd apps/desktop

          collect_macos_desktop_diagnostics() {
            local label="${1:-failure}"
            if [[ "${{ matrix.platform }}" != macos-* ]]; then
              return 0
            fi

            bash "${DESKTOP_DIAGNOSTICS_SCRIPT:-$GITHUB_WORKSPACE/.github/scripts/collect-macos-desktop-diagnostics.sh}" "$label" || true
          }

          terminate_process_tree() {
            local pid="$1"
            terminate_process_tree_with_signal "$pid" TERM
            sleep 5
            terminate_process_tree_with_signal "$pid" KILL
          }

          terminate_process_tree_with_signal() {
            local pid="$1"
            local signal="$2"
            local child
            while IFS= read -r child; do
              [ -n "$child" ] || continue
              terminate_process_tree_with_signal "$child" "$signal"
            done < <(pgrep -P "$pid" 2>/dev/null || true)
            kill "-$signal" "$pid" 2>/dev/null || true
          }

          run_with_timeout() {
            local timeout_seconds="$1"
            shift
            if [ "$timeout_seconds" -le 0 ]; then
              "$@"
              return $?
            fi

            "$@" &
            local command_pid=$!
            local start_seconds
            start_seconds="$(date +%s)"
            while kill -0 "$command_pid" 2>/dev/null; do
              local now_seconds
              now_seconds="$(date +%s)"
              if [ $((now_seconds - start_seconds)) -ge "$timeout_seconds" ]; then
                echo "::warning::Command timed out after ${timeout_seconds}s: $*"
                collect_macos_desktop_diagnostics "timeout"
                terminate_process_tree "$command_pid"
                wait "$command_pid" 2>/dev/null || true
                return 124
              fi
              sleep 10
            done
            wait "$command_pid"
          }

          run_tauri_build() {
            run_with_timeout "$TAURI_BUILD_TIMEOUT_SECONDS" \
              pnpm tauri build \
                --features desktop-runtime \
                --target "${{ matrix.rust_target }}" \
                --bundles "$tauri_bundles" \
                --config "$updater_config"
          }

          status=0
          for attempt in $(seq 1 "$TAURI_BUNDLE_ATTEMPTS"); do
            echo "Tauri desktop build attempt $attempt/$TAURI_BUNDLE_ATTEMPTS"
            if run_tauri_build; then
              status=0
              break
            else
              status=$?
            fi

            echo "::warning::Tauri desktop build attempt $attempt/$TAURI_BUNDLE_ATTEMPTS failed with exit code $status."
            collect_macos_desktop_diagnostics "attempt-${attempt}"
            if [ "$attempt" -lt "$TAURI_BUNDLE_ATTEMPTS" ]; then
              sleep 20
            fi
          done

          exit "$status"

      - name: Collect macOS desktop diagnostics
        if: failure() && startsWith(matrix.platform, 'macos-')
        env:
          DESKTOP_DIAGNOSTICS_PLATFORM: ${{ matrix.platform }}
          DESKTOP_DIAGNOSTICS_RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          bash "${DESKTOP_DIAGNOSTICS_SCRIPT:-$GITHUB_WORKSPACE/.github/scripts/collect-macos-desktop-diagnostics.sh}" failure || true

      - name: Upload macOS desktop diagnostics
        if: failure() && startsWith(matrix.platform, 'macos-')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-diagnostics-${{ matrix.platform }}
          path: |
            dist/desktop-diagnostics/**
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/dmg/**
            apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle/macos/**
            apps/desktop/src-tauri/target/release/bundle/dmg/**
            apps/desktop/src-tauri/target/release/bundle/macos/**
          if-no-files-found: ignore
          include-hidden-files: true

      - name: Sign Windows desktop artifacts
        if: matrix.platform == 'windows-x64' && env.WINDOWS_SIGNING_ENABLED == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          WINDOWS_SIGNTOOL_PATH: ${{ secrets.WINDOWS_SIGNTOOL_PATH }}
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP "kandev-code-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))

          $bundleDir = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          if (!(Test-Path $bundleDir)) {
            $bundleDir = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/target/release/bundle"
          }
          if (!(Test-Path $bundleDir)) {
            Write-Error "Missing Tauri bundle directory"
            exit 1
          }

          $timestampUrl = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_TIMESTAMP_URL)) { "https://timestamp.digicert.com" } else { $env:WINDOWS_TIMESTAMP_URL }
          $signTool = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNTOOL_PATH)) { "signtool" } else { $env:WINDOWS_SIGNTOOL_PATH }
          $artifacts = @(Get-ChildItem -Path $bundleDir -Recurse -File -Include *.exe, *.msi)
          if ($artifacts.Count -eq 0) {
            Write-Error "No Windows installer artifacts found under $bundleDir"
            exit 1
          }

          function Invoke-SignTool {
            param(
              [Parameter(Mandatory = $true)]
              [string[]]$Arguments,
              [Parameter(Mandatory = $true)]
              [string]$Description
            )

            & $signTool @Arguments
            if ($LASTEXITCODE -ne 0) {
              throw "$Description failed with exit code $LASTEXITCODE"
            }
          }

          # signtool sign is the default Windows signing mechanism for CI artifacts.
          try {
            foreach ($artifact in $artifacts) {
              $signArguments = @(
                "sign", "/fd", "SHA256", "/td", "SHA256", "/tr", $timestampUrl,
                "/f", $certificatePath,
                "/p", $env:WINDOWS_CERTIFICATE_PASSWORD,
                $artifact.FullName
              )
              $verifyArguments = @("verify", "/pa", $artifact.FullName)

              Invoke-SignTool `
                -Description "signtool sign $($artifact.Name)" `
                -Arguments $signArguments
              Invoke-SignTool `
                -Description "signtool verify $($artifact.Name)" `
                -Arguments $verifyArguments
            }
          } finally {
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Collect desktop artifacts
        run: |
          set -euo pipefail
          out_dir="$GITHUB_WORKSPACE/dist/desktop-artifacts"
          mkdir -p "$out_dir"

          bundle_dir="apps/desktop/src-tauri/target/${{ matrix.rust_target }}/release/bundle"
          if [ ! -d "$bundle_dir" ]; then
            bundle_dir="apps/desktop/src-tauri/target/release/bundle"
          fi
          if [ ! -d "$bundle_dir" ]; then
            echo "Missing Tauri bundle directory" >&2
            exit 1
          fi

          found=0
          while IFS= read -r -d '' artifact; do
            base="$(basename "$artifact")"
            dest="$out_dir/kandev-desktop-${{ matrix.platform }}-$base"
            cp "$artifact" "$dest"
            scripts/release/write-sha256.sh "$dest" "$dest.sha256"
            found=$((found + 1))
          done < <(find "$bundle_dir" -type f \( \
            -name '*.dmg' -o \
            -name '*.deb' -o \
            -name '*.rpm' -o \
            -name '*.msi' -o \
            -name '*.exe' -o \
            -name '*.AppImage' -o \
            -name '*.app.tar.gz' -o \
            -name '*.AppImage.tar.gz' -o \
            -name '*.nsis.zip' -o \
            -name '*.sig' \
          \) -print0)

          if [ "$found" -eq 0 ]; then
            echo "No desktop artifacts found under $bundle_dir" >&2
            exit 1
          fi

          if [ "${UPDATER_SIGNING_ENABLED:-false}" = "true" ]; then
            bash "$DESKTOP_ASSET_VERIFIER" --require-updaters \
              "$out_dir" "${{ matrix.platform }}"
          else
            bash "$DESKTOP_ASSET_VERIFIER" "$out_dir" "${{ matrix.platform }}"
          fi
          ls -lh "$out_dir"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.platform }}
          path: dist/desktop-artifacts/*

  # ---------------------------------------------------------------------------
  # Docker base image — split per arch onto native runners, then stitched into
  # a multi-arch manifest list. Each arch consumes the matching linux bundle
  # produced by build-bundles, so no Go/Vite/pnpm work happens inside the
  # Docker build (the Dockerfile is reduced to apt-get + COPY).
  # ---------------------------------------------------------------------------
  docker-amd64:
    name: Build & push container image (amd64)
    needs: [prepare, build-bundles]
    if: >-
      ${{ !cancelled() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.channel == 'stable' &&
        !inputs.dry_run &&
        !inputs.desktop_validation_only &&
        needs.prepare.result == 'success' &&
        needs.build-bundles.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      STAGING_IMAGE: ghcr.io/kdlbs/kandev:base-staging-${{ needs.prepare.outputs.tag }}-${{ github.run_id }}-amd64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-linux-x64
          path: dist/bundle

      - name: Prepare Docker build context
        run: |
          set -euo pipefail
          mkdir -p ctx/bundle
          # --strip-components=1 drops the top-level `kandev/` dir inside the
          # tarball so ctx/bundle/ ends up with bin/ directly.
          tar -xzf dist/bundle/kandev-linux-x64.tar.gz --strip-components=1 -C ctx/bundle
          cp docker-entrypoint.sh ctx/

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OCI labels are produced once here per arch. The manifest job combines
      # the per-arch image manifests into a multi-arch list via `imagetools
      # create`, which cannot retroactively add labels to image configs, so
      # the labels MUST be stamped at build time on each arch. GHCR's package
      # page link + provenance tooling rely on these annotations.
      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kdlbs/kandev

      # The inline Buildx command uses the GHA cache backend directly. This
      # helper exposes ACTIONS_RUNTIME_TOKEN and ACTIONS_CACHE_URL, which
      # docker/build-push-action normally prepares for its own invocation.
      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build and push (amd64 staging tag)
        id: build
        env:
          DOCKER_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          metadata_file="$RUNNER_TEMP/docker-metadata.json"
          label_args=()
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            label_args+=(--label "$label")
          done <<<"$DOCKER_LABELS"

          bash scripts/release/retry-ghcr-command.sh \
            docker buildx build \
            --file ./Dockerfile \
            --platform linux/amd64 \
            --push \
            --tag "$STAGING_IMAGE" \
            "${label_args[@]}" \
            --provenance=false \
            --sbom=false \
            --cache-from type=gha,scope=base-amd64 \
            --cache-to type=gha,mode=max,scope=base-amd64 \
            --metadata-file "$metadata_file" \
            ./ctx

          digest="$(jq -er '."containerimage.digest"' "$metadata_file")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  docker-arm64:
    name: Build & push container image (arm64)
    needs: [prepare, build-bundles, docker-amd64]
    if: >-
      ${{ !cancelled() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.channel == 'stable' &&
        !inputs.dry_run &&
        !inputs.desktop_validation_only &&
        needs.prepare.result == 'success' &&
        needs.build-bundles.result == 'success' &&
        needs.docker-amd64.result == 'success'
      }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      STAGING_IMAGE: ghcr.io/kdlbs/kandev:base-staging-${{ needs.prepare.outputs.tag }}-${{ github.run_id }}-arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle-linux-arm64
          path: dist/bundle

      - name: Prepare Docker build context
        run: |
          set -euo pipefail
          mkdir -p ctx/bundle
          tar -xzf dist/bundle/kandev-linux-arm64.tar.gz --strip-components=1 -C ctx/bundle
          cp docker-entrypoint.sh ctx/

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kdlbs/kandev

      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build and push (arm64 staging tag)
        id: build
        env:
          DOCKER_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          metadata_file="$RUNNER_TEMP/docker-metadata.json"
          label_args=()
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            label_args+=(--label "$label")
          done <<<"$DOCKER_LABELS"

          bash scripts/release/retry-ghcr-command.sh \
            docker buildx build \
            --file ./Dockerfile \
            --platform linux/arm64 \
            --push \
            --tag "$STAGING_IMAGE" \
            "${label_args[@]}" \
            --provenance=false \
            --sbom=false \
            --cache-from type=gha,scope=base-arm64 \
            --cache-to type=gha,mode=max,scope=base-arm64 \
            --metadata-file "$metadata_file" \
            ./ctx

          digest="$(jq -er '."containerimage.digest"' "$metadata_file")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  docker-manifest:
    name: Assemble multi-arch base manifest
    needs: [prepare, docker-amd64, docker-arm64]
    if: >-
      ${{ !cancelled() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.channel == 'stable' &&
        !inputs.dry_run &&
        !inputs.desktop_validation_only &&
        needs.prepare.result == 'success' &&
        needs.docker-amd64.result == 'success' &&
        needs.docker-arm64.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kdlbs/kandev
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=sha
            type=raw,value=latest

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `imagetools create` combines two single-arch images into a multi-arch
      # manifest list under each of the user-facing tags. No layers are
      # rebuilt or re-uploaded; this is a registry-side metadata operation.
      # The per-arch source images are referenced by digest (not by the
      # mutable staging tag) so this is pinned to the exact bytes the
      # per-arch jobs just pushed.
      - name: Combine arch images into multi-arch tags
        env:
          AMD64_REF: ghcr.io/kdlbs/kandev@${{ needs.docker-amd64.outputs.digest }}
          ARM64_REF: ghcr.io/kdlbs/kandev@${{ needs.docker-arm64.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          tag_args=()
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            tag_args+=(--tag "$tag")
          done <<<"$TAGS"
          bash scripts/release/retry-ghcr-command.sh \
            docker buildx imagetools create \
            "${tag_args[@]}" "$AMD64_REF" "$ARM64_REF"

  # ---------------------------------------------------------------------------
  # Universal image — same per-arch native split, on top of the base image
  # we just promoted. The size gate inspects the amd64 staging tag and aborts
  # before the user-facing :universal tags are moved.
  # ---------------------------------------------------------------------------
  docker-universal-amd64:
    name: Build & push universal image (amd64)
    needs: [prepare, docker-manifest]
    if: >-
      ${{ !cancelled() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.channel == 'stable' &&
        !inputs.dry_run &&
        !inputs.desktop_validation_only &&
        needs.prepare.result == 'success' &&
        needs.docker-manifest.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      STAGING_IMAGE: ghcr.io/kdlbs/kandev:universal-staging-${{ needs.prepare.outputs.tag }}-${{ github.run_id }}-amd64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kdlbs/kandev

      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build and push (universal amd64 staging tag)
        id: build
        env:
          DOCKER_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          metadata_file="$RUNNER_TEMP/docker-metadata.json"
          label_args=()
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            label_args+=(--label "$label")
          done <<<"$DOCKER_LABELS"

          bash scripts/release/retry-ghcr-command.sh \
            docker buildx build \
            --file Dockerfile.universal \
            --platform linux/amd64 \
            --push \
            --build-arg BASE_IMAGE="ghcr.io/kdlbs/kandev:${{ needs.prepare.outputs.tag }}" \
            --tag "$STAGING_IMAGE" \
            "${label_args[@]}" \
            --provenance=false \
            --sbom=false \
            --cache-from type=gha,scope=universal-amd64 \
            --cache-to type=gha,mode=max,scope=universal-amd64 \
            --metadata-file "$metadata_file" \
            .

          digest="$(jq -er '."containerimage.digest"' "$metadata_file")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  docker-universal-arm64:
    name: Build & push universal image (arm64)
    needs: [prepare, docker-manifest, docker-universal-amd64]
    if: >-
      ${{ !cancelled() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.channel == 'stable' &&
        !inputs.dry_run &&
        !inputs.desktop_validation_only &&
        needs.prepare.result == 'success' &&
        needs.docker-manifest.result == 'success' &&
        needs.docker-universal-amd64.result == 'success'
      }}
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      STAGING_IMAGE: ghcr.io/kdlbs/kandev:universal-staging-${{ needs.prepare.outputs.tag }}-${{ github.run_id }}-arm64
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kdlbs/kandev

      - uses: crazy-max/ghaction-github-runtime@04d248b84655b509d8c44dc1d6f990c879747487 # v4.0.0

      - name: Build and push (universal arm64 staging tag)
        id: build
        env:
          DOCKER_LABELS: ${{ steps.meta.outputs.labels }}
        run: |
          set -euo pipefail
          metadata_file="$RUNNER_TEMP/docker-metadata.json"
          label_args=()
          while IFS= read -r label; do
            [ -z "$label" ] && continue
            label_args+=(--label "$label")
          done <<<"$DOCKER_LABELS"

          bash scripts/release/retry-ghcr-command.sh \
            docker buildx build \
            --file Dockerfile.universal \
            --platform linux/arm64 \
            --push \
            --build-arg BASE_IMAGE="ghcr.io/kdlbs/kandev:${{ needs.prepare.outputs.tag }}" \
            --tag "$STAGING_IMAGE" \
            "${label_args[@]}" \
            --provenance=false \
            --sbom=false \
            --cache-from type=gha,scope=universal-arm64 \
            --cache-to type=gha,mode=max,scope=universal-arm64 \
            --metadata-file "$metadata_file" \
            .

          digest="$(jq -er '."containerimage.digest"' "$metadata_file")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  docker-universal-manifest:
    name: Gate size + promote universal manifest
    # docker-universal-manifest is included in publish-release's `needs` so
    # its size gate (and any per-arch build failure) blocks the release.
    needs: [prepare, docker-universal-amd64, docker-universal-arm64]
    if: >-
      ${{ !cancelled() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.channel == 'stable' &&
        !inputs.dry_run &&
        !inputs.desktop_validation_only &&
        needs.prepare.result == 'success' &&
        needs.docker-universal-amd64.result == 'success' &&
        needs.docker-universal-arm64.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      AMD64_REF: ghcr.io/kdlbs/kandev@${{ needs.docker-universal-amd64.outputs.digest }}
      ARM64_REF: ghcr.io/kdlbs/kandev@${{ needs.docker-universal-arm64.outputs.digest }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Universal size gate. Inspects the amd64 staging image by digest - the
      # image is in GHCR but under a per-run tag no user pulls. Failing the
      # gate aborts before promotion, so the user-facing :universal /
      # :vX.Y.Z-universal tags never move to an oversized image. Bump
      # MAX_COMPRESSED_BYTES deliberately when adding scope, with a
      # one-sentence justification in the commit msg. amd64 is the bigger of
      # the two arches in practice, so gating on it gives us a single-number
      # signal. Per-arch staging builds set provenance: false, so the digest
      # points directly at the image manifest (not an OCI index).
      - name: Enforce size budget
        env:
          MAX_COMPRESSED_BYTES: "2684354560"   # 2.5 GiB
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$AMD64_REF" --raw > /tmp/manifest.json
          TOTAL="$(jq '[.layers[].size] | add' /tmp/manifest.json)"
          echo "Universal image (amd64) compressed size: $TOTAL bytes (max: $MAX_COMPRESSED_BYTES)"
          if [ "$TOTAL" -gt "$MAX_COMPRESSED_BYTES" ]; then
            echo "::error::Universal image exceeds compressed-size budget. Staging tags will not be promoted. See docs/images.md inclusion policy." >&2
            exit 1
          fi

      # Promote: combine both arches into a single multi-arch manifest list
      # under the user-facing tags. `imagetools create` is a metadata-only
      # registry call - no layers are rebuilt or re-uploaded. Per-arch source
      # images referenced by digest, not tag, so this is pinned to the bytes
      # the previous jobs pushed.
      - name: Promote staging to final tags
        run: |
          set -euo pipefail
          bash scripts/release/retry-ghcr-command.sh \
            docker buildx imagetools create \
            --tag "ghcr.io/kdlbs/kandev:${{ needs.prepare.outputs.version }}-universal" \
            --tag "ghcr.io/kdlbs/kandev:${{ needs.prepare.outputs.tag }}-universal" \
            --tag "ghcr.io/kdlbs/kandev:universal" \
            "$AMD64_REF" "$ARM64_REF"

  publish-release:
    name: Publish GitHub release
    needs: [prepare, build-bundles, build-desktop, docker-universal-manifest]
    if: >-
      ${{ !cancelled() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.channel == 'stable' &&
        !inputs.dry_run &&
        !inputs.desktop_validation_only &&
        needs.prepare.result == 'success' &&
        needs.build-bundles.result == 'success' &&
        needs.build-desktop.result == 'success' &&
        needs.docker-universal-manifest.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write    # softprops/action-gh-release creates the release
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0

      - name: Prepare desktop asset verifier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          helper="$RUNNER_TEMP/verify-desktop-assets.sh"
          gh api \
            --header "Accept: application/vnd.github.raw+json" \
            "repos/${{ github.repository }}/contents/scripts/release/verify-desktop-assets.sh?ref=${{ github.workflow_sha }}" \
            > "$helper"
          echo "DESKTOP_ASSET_VERIFIER=$helper" >> "$GITHUB_ENV"

      - name: Install updater signature verifier toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Generate release notes
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add unsigned desktop warning to release notes
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail

          unsigned=()
          macos_unsigned=false
          if ! bash scripts/release/desktop-signing-ready.sh macos >/dev/null 2>&1; then
            unsigned+=("macOS")
            macos_unsigned=true
          fi
          if ! bash scripts/release/desktop-signing-ready.sh windows >/dev/null 2>&1; then
            unsigned+=("Windows")
          fi
          if [ "${#unsigned[@]}" -eq 0 ]; then
            exit 0
          fi

          platforms="${unsigned[0]}"
          for ((i = 1; i < ${#unsigned[@]}; i++)); do
            platforms="$platforms, ${unsigned[$i]}"
          done
          tmp="$(mktemp)"
          {
            echo "> [!WARNING]"
            echo "> $platforms desktop installers in this release are unsigned development builds."
            echo "> They may require manual OS security bypasses and are not trusted downloads."
            if [ "$macos_unsigned" = "true" ]; then
              echo ">"
              echo "> If macOS blocks Kandev after you verify the checksum, run:"
              echo ">"
              echo '> ```bash'
              echo "> xattr -d com.apple.quarantine /Applications/Kandev.app"
              echo '> ```'
            fi
            echo
            cat RELEASE_NOTES.md
          } > "$tmp"
          mv "$tmp" RELEASE_NOTES.md

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          path: dist/release-assets
          merge-multiple: true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: desktop-*
          path: dist/release-assets
          merge-multiple: true

      - name: Verify release assets
        run: |
          set -euo pipefail
          required_platforms=(linux-x64 linux-arm64 macos-x64 macos-arm64 windows-x64)
          for platform in "${required_platforms[@]}"; do
            archive="dist/release-assets/kandev-${platform}.tar.gz"
            checksum="${archive}.sha256"
            if [ ! -f "$archive" ]; then
              echo "Missing required archive: $archive" >&2
              exit 1
            fi
            if [ ! -f "$checksum" ]; then
              echo "Missing required checksum: $checksum" >&2
              exit 1
            fi
          done
          # The Windows zip is the only archive winget and Chocolatey can read.
          # Losing it would break those channels while every other check here
          # still passed, so it is verified explicitly.
          for artifact in \
            dist/release-assets/kandev-windows-x64.zip \
            dist/release-assets/kandev-windows-x64.zip.sha256; do
            if [ ! -f "$artifact" ]; then
              echo "Missing required Windows artifact: $artifact" >&2
              exit 1
            fi
          done
          bash "$DESKTOP_ASSET_VERIFIER" dist/release-assets
          ls -lh dist/release-assets

      - name: Generate and verify updater manifest
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: |
          set -euo pipefail
          pub_date="$(git show -s --format=%cI '${{ needs.prepare.outputs.tag }}^{commit}')"
          node scripts/release/updater-manifest.mjs generate \
            --assets-dir dist/release-assets \
            --output dist/release-assets/latest.json \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --repository "${{ github.repository }}" \
            --notes-file RELEASE_NOTES.md \
            --pub-date "$pub_date" \
            --allow-unsigned
          if [ -f dist/release-assets/latest.json ]; then
            node scripts/release/updater-manifest.mjs verify \
              --assets-dir dist/release-assets \
              --manifest dist/release-assets/latest.json \
              --version "${{ needs.prepare.outputs.version }}" \
              --tag "${{ needs.prepare.outputs.tag }}" \
              --repository "${{ github.repository }}"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: RELEASE_NOTES.md
          files: |
            dist/release-assets/kandev-linux-*.tar.gz
            dist/release-assets/kandev-linux-*.tar.gz.sha256
            dist/release-assets/kandev-macos-*.tar.gz
            dist/release-assets/kandev-macos-*.tar.gz.sha256
            dist/release-assets/kandev-windows-*.tar.gz
            dist/release-assets/kandev-windows-*.tar.gz.sha256
            dist/release-assets/kandev-windows-*.zip
            dist/release-assets/kandev-windows-*.zip.sha256
            dist/release-assets/kandev-desktop-*
            dist/release-assets/latest.json
          preserve_order: true

  publish-npm:
    name: Publish npm packages
    needs: [prepare, publish-release]
    if: >-
      ${{ !cancelled() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.channel == 'stable' &&
        !inputs.dry_run &&
        !inputs.desktop_validation_only &&
        needs.prepare.result == 'success' &&
        needs.publish-release.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # Required for OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: "9.15.9"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm -C apps install --frozen-lockfile

      - name: Publish npm packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash scripts/release/publish-npm.sh \
            --version "${{ needs.prepare.outputs.version }}" \
            --dist-tag latest \
            --release-tag "${{ needs.prepare.outputs.tag }}"

  publish-npm-nightly:
    name: Publish npm nightly packages
    needs: [nightly-prepare, build-bundles]
    if: >-
      ${{ !cancelled() &&
        (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.channel == 'nightly' && !inputs.dry_run)) &&
        needs.nightly-prepare.result == 'success' &&
        needs.nightly-prepare.outputs.should_publish == 'true' &&
        needs.build-bundles.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write    # Required for OIDC trusted publishing
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.nightly-prepare.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5
        with:
          version: "9.15.9"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
          cache-dependency-path: apps/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm -C apps install --frozen-lockfile

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          path: dist/nightly-assets
          merge-multiple: true

      - name: Publish npm nightly packages
        env:
          NIGHTLY_BASELINE: ${{ needs.nightly-prepare.outputs.stable_version }}
          NIGHTLY_AT_START: ${{ needs.nightly-prepare.outputs.nightly_version_at_start }}
          NIGHTLY_TAGS_AT_START: ${{ needs.nightly-prepare.outputs.nightly_tags_at_start }}
        run: |
          bash scripts/release/nightly-release.sh publish \
            --stable-at-start "$NIGHTLY_BASELINE" \
            --nightly-at-start "$NIGHTLY_AT_START" \
            --tags-at-start "$NIGHTLY_TAGS_AT_START" \
            --version "${{ needs.nightly-prepare.outputs.version }}" \
            --assets-dir dist/nightly-assets

  update-homebrew-tap:
    name: Update Homebrew tap
    needs: [prepare, publish-release]
    if: >-
      ${{ !cancelled() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.channel == 'stable' &&
        !inputs.dry_run &&
        !inputs.desktop_validation_only &&
        needs.prepare.result == 'success' &&
        needs.publish-release.result == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.prepare.outputs.ref }}

      - name: Update Homebrew tap formula
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          bash scripts/release/update-homebrew-tap.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.tag }}"

  update-scoop-bucket:
    name: Update Scoop bucket
    needs: [prepare, publish-release]
    if: >-
      ${{ !cancelled() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.channel == 'stable' &&
        !inputs.dry_run &&
        !inputs.desktop_validation_only &&
        needs.prepare.result == 'success' &&
        needs.publish-release.result == 'success'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # Backfill application artifacts come from the selected tag, but the
          # publication helper must come from the current workflow revision.
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Require Scoop bucket deploy key
        env:
          SCOOP_BUCKET_DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$SCOOP_BUCKET_DEPLOY_KEY" ]; then
            echo "::error::SCOOP_BUCKET_DEPLOY_KEY is required to publish the Scoop bucket." >&2
            exit 1
          fi

      - name: Update Scoop bucket
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SCOOP_BUCKET_DEPLOY_KEY: ${{ secrets.SCOOP_BUCKET_DEPLOY_KEY }}
        run: |
          bash scripts/release/update-scoop-bucket.sh \
            "${{ needs.prepare.outputs.version }}" \
            "${{ needs.prepare.outputs.tag }}"
