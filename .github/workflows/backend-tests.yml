name: PR4503 retained regression proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go-race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14
        with:
          go-version-file: apps/backend/go.mod
          cache: false
      - name: Retained SQLite and barrier regressions under race detector
        working-directory: apps/backend
        run: go test -race -count=1 -v ./internal/orchestrator/messagequeue ./internal/orchestrator/handlers ./internal/orchestrator -run 'TestSessionAdmission|TestQueueMutationsReturnRetryableAdmissionTimeout|TestAttachmentCleanup(Budget|Acknowledgements|EditLease)|TestQueuedAdmissionRecovery' -timeout=5m
  web-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Install locked dependencies
        working-directory: apps
        run: pnpm install --frozen-lockfile
      - name: Queue API regressions
        working-directory: apps/web
        run: pnpm exec vitest run lib/api/domains/queue-api.test.ts
