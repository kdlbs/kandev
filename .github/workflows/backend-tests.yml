name: PR4503 focused GREEN proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14
        with:
          go-version-file: apps/backend/go.mod
          cache: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Install locked dependencies
        working-directory: apps
        run: pnpm install --frozen-lockfile
      - name: Go production SQLite and barrier contracts
        working-directory: apps/backend
        run: go test -race -p 2 -count=1 -v ./internal/orchestrator/messagequeue ./internal/orchestrator/handlers ./internal/orchestrator -run 'TestSessionAdmission|TestQueueMutationsReturnRetryableAdmissionTimeout|TestQueueAdmissionTimeoutThroughSQLiteHandlers|TestAttachmentCleanup(Budget|Acknowledgements|EditLease)|TestQueuedAdmissionRecovery|TestQueueUserPrompt_RuntimeUnavailableSurvivesFastPathRedispatch|TestPromptTask_.*ClassifiedRuntimeUnavailable|TestSendNowWorkersCanRestartAfterStop|TestSendNowRecoveryDetachesWorkerCancellation|TestExecuteSendNowClaim|TestPendingSendNowRestoreUsesReservationGeneration' -timeout=5m
      - name: Queue API and feedback contracts
        if: always()
        working-directory: apps/web
        run: pnpm exec vitest run lib/api/domains/queue-api.test.ts lib/queue-mutation-error.test.ts hooks/use-queue-edit-protection.test.ts components/task/chat/queued-ghost-list.test.tsx components/task/chat/queued-ghost-message.test.tsx components/task/chat/queued-ghost-message-overflow.test.tsx
      - name: Install Chromium
        if: always()
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Desktop busy refusal and real successful retry
        if: always()
        working-directory: apps/web
        run: pnpm e2e:run --host --project chromium -- tests/chat/queue-admission-busy.spec.ts --retries=0
      - name: Phone busy refusal and real successful retry
        if: always()
        working-directory: apps/web
        run: pnpm e2e:run --host --no-build --project mobile-chrome -- tests/chat/mobile-queue-admission-busy.spec.ts --retries=0
      - name: Validate durable documentation
        if: always()
        run: |
          python3 scripts/list-docs.py validate
          python3 scripts/lint-spec-files.py --all
      - name: Preserve browser diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr4503-focused-browser-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          if-no-files-found: warn
