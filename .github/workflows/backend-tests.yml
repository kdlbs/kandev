name: PR4503 deferred drain generation RED
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14
        with:
          go-version-file: apps/backend/go.mod
          cache: false
      - name: Actual SQL drain crossing Stop at the cancel guard
        working-directory: apps/backend
        run: go test -race -p 2 -count=1 -v ./internal/orchestrator -run '^TestQueuedAdmissionRecoveryDrainCannotCrossStopWhileWaitingForCancelGuard$' -timeout=5m
