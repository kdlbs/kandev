name: Backend Tests

# No trigger-level `paths:` filter, deliberately. A workflow skipped by one
# reports no conclusion at all, and a required check that never reports leaves
# a pull request unable to enter a merge queue and a merge group unable to
# leave it. `merge_group` cannot carry a `paths:` filter in the first place.
# The filter lives in the `changes` job below instead, and the `test` job
# reports the single conclusion the queue waits on. See docs/ci-merge-queue.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      sidebar_resources_only:
        description: Run only the sidebar memory and timing evidence jobs
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a merge-queue run. Its ref is unique per queue entry, so a
  # cancellation here could only come from a mis-keyed group, and the queue
  # would read the cancelled check as a failure and eject the pull request.
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}

# Least-privilege default. The Linux static/test jobs and the Windows `test-windows`
# job only read source and run tests — no PR/issue writes, no release ops.
# `packages: read` is required for the Linux job to pull the kandev-ci
# container image from GHCR (currently public; explicit grant keeps the
# workflow working if the package ever goes private). Declaring any scope
# explicitly zeroes out every unlisted one.
permissions:
  contents: read
  packages: read

env:
  # Container jobs may override HOME. Keep Corepack pointed at the pnpm cache
  # prepared in the CI image.
  COREPACK_HOME: /root/.cache/node/corepack
  GOFLAGS: -trimpath

jobs:
  # The former trigger-level `paths:` list, applied one level down so a skip
  # still produces a conclusion. `.github/scripts/changed-paths.py` implements
  # the same last-match-wins semantics GitHub applies to `paths:`.
  changes:
    name: Detect relevant changes
    # Checkout receives the short-lived job token. Keep this credential-bearing
    # path on GitHub-hosted capacity during the external-runner pilot.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      run: ${{ steps.detect.outputs.run }}
      sidebar_resources: ${{ steps.detect.outputs.sidebar_resources }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # The base commit has to be present locally for the diff below. Every
          # other job in this workflow already pays for a full clone.
          fetch-depth: 0
          persist-credentials: false

      - name: Plan runner allocation
        id: plan
        uses: ./.github/actions/plan-external-runners
        with:
          workflow: backend
          run-id: ${{ github.run_id }}
          families: >-
            [{"name":"test","tier":"light"}]
          burst: ${{ vars.KANDEV_CI_EXTERNAL_ENABLED }}
          percent: ${{ vars.KANDEV_CI_EXTERNAL_PERCENT }}
          light-label: ${{ vars.KANDEV_CI_RUNNER_LIGHT }}
          standard-label: ${{ vars.KANDEV_CI_RUNNER_STANDARD }}

      - name: Check SDK CI selection
        run: python3 .github/scripts/plugin-sdk-ci-contract_test.py

      - name: Detect relevant changes
        id: detect
        env:
          PATTERNS: |
            apps/backend/**
            apps/packages/plugin-sdk/**
            pluginsdk/**
            scripts/pluginsdk/**
            scripts/release/*plugin-sdk*
            scripts/release/sdk-*
            .github/scripts/plugin-sdk-ci-contract_test.py
            apps/web/lib/settings-discovery/contract.generated.json
            apps/web/lib/settings-discovery/profile-contract.generated.json
            scripts/settings-contract-ci.test.mjs
            scripts/check-agentctl-deps.sh
            scripts/*.ps1
            scripts/*.psm1
            scripts/tests/isolated-*
            .gitattributes
            # check-make-shells also lints the root Makefile's $(shell ...)
            # probes, so a change there has to be able to trip it.
            Makefile
            scripts/check-make-shells
            .github/workflows/backend-tests.yml
            .github/docker/ci-base/**
            .github/actions/cache-go/**
            .github/scripts/go-cache-identity.*
            .github/scripts/repository-test-shard.py
            .github/scripts/changed-paths.py
            .github/scripts/runner-plan.py
            .github/actions/plan-external-runners/**
            .github/scripts/bounded-step-summary.py
            !**/*.md
            !**/*.mdx
            !**/*.markdown
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          SIDEBAR_RESOURCES_ONLY: ${{ inputs.sidebar_resources_only }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" && "${SIDEBAR_RESOURCES_ONLY}" == "true" ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "sidebar_resources=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "${EVENT_NAME}" in
            # The checkout is the merge ref, whose first parent is the base
            # branch tip. Diffing against that tip directly collapses to a
            # two-dot diff over everything main landed since the PR opened, so
            # take the fork point instead.
            pull_request) BASE="$(git merge-base HEAD "origin/${BASE_REF}")" ;;
            # The queue branch is cut from this commit, so it is a true ancestor.
            merge_group) BASE="${MERGE_GROUP_BASE_SHA}" ;;
            push) BASE="${PUSH_BEFORE}" ;;
            *) BASE="" ;;
          esac

          # Fail open. A first push to a branch, a force push, or an unknown
          # event leaves no usable base, and running the suite needlessly is
          # cheaper than merging something no job ever looked at.
          if [[ -z "${BASE}" || "${BASE}" == "0000000000000000000000000000000000000000" ]] \
             || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "No usable base commit for '${EVENT_NAME}'; running everything."
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "sidebar_resources=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `-z`, not plain --name-only: git quotes non-ASCII paths under its
          # default core.quotePath, and a quoted path matches no pattern, so a
          # change to one would skip every job and still report success.
          git diff --name-only -z "${BASE}" HEAD \
            | python3 .github/scripts/changed-paths.py
          if git diff --name-only "${BASE}" HEAD | grep -E '^(apps/backend/internal/task/repository/sqlite/sidebar_task_query.*[.]go|apps/backend/internal/testutil/sqlitememory/|[.]github/workflows/backend-tests[.]yml$)' >/dev/null; then
            echo "sidebar_resources=true" >> "$GITHUB_OUTPUT"
          else
            echo "sidebar_resources=false" >> "$GITHUB_OUTPUT"
          fi

  sdk_builder:
    name: Plugin SDK Docker builder
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Build the host with the standalone SDK layout
        run: docker build --target go-builder -f e2e.Dockerfile -t kandev-sdk-go-builder-check .

  sdk_package:
    name: Plugin SDK packed consumer
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Read packaging tool versions
        id: tools
        run: node -e 'const c=require("./scripts/pluginsdk/pack-config.json"); console.log("node="+c.node); console.log("npm="+c.npm)' >> "$GITHUB_OUTPUT"
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ steps.tools.outputs.node }}
          package-manager-cache: false
      - name: Install pinned npm
        env:
          NPM_VERSION: ${{ steps.tools.outputs.npm }}
        run: npm install --global --ignore-scripts "npm@${NPM_VERSION}"
      - name: Set up Go for the combined consumer
        uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14 # v7.0.0 + upstream dependency refresh
        with:
          go-version-file: pluginsdk/go.mod
          cache: false
      - name: Check the standalone npm artifact
        run: |
          node scripts/pluginsdk/sync-record.mjs --check
          node scripts/release/plugin-sdk.mjs --check
          node --test scripts/pluginsdk/sync-record.test.mjs scripts/pluginsdk/pack-candidate.test.mjs scripts/pluginsdk/npm-workspace.test.mjs scripts/pluginsdk/public-trust.test.mjs scripts/release/plugin-sdk.test.mjs scripts/release/publish-plugin-sdk.test.mjs scripts/release/sdk-*.test.mjs
          node scripts/pluginsdk/consumer-smoke.mjs --mode local

  static_checks:
    name: Backend Static Checks
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # Checkout receives the short-lived job token. Keep this credential-bearing
    # path on GitHub-hosted capacity during the external-runner pilot.
    runs-on: ubuntu-latest
    # Include cold builds, SDK consumers, the 15-minute lint budget, and cache cleanup.
    timeout-minutes: 30
    # Pre-baked image bundles Go, golangci-lint, go-licenses, Docker CLI, Node,
    # pnpm, and the Playwright base — see .github/docker/ci-base/Dockerfile.
    # Skips the per-run setup-go / golangci-lint download steps below.
    container: ghcr.io/kdlbs/kandev-ci:build-latest
    env:
      GOLANGCI_LINT_CACHE: /root/.cache/golangci-lint
    defaults:
      run:
        # Container jobs default to `sh` (dash); pin to bash so `set -o pipefail`
        # and other bash-isms in the steps below work without per-step overrides.
        shell: bash
        working-directory: apps/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # actions/checkout under a container job marks the workspace as a safe
      # directory automatically, but subsequent `git` invocations from steps
      # that run outside the action (e.g. the gofmt diff below) can still hit
      # "dubious ownership" when the runner UID differs from the repo owner.
      - name: Mark workspace safe for git
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go modules and compilation
        uses: ./.github/actions/cache-go
        with:
          family: static
          save-mode: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'all' || 'none' }}

      - name: Build
        run: go build -v ./cmd/kandev

      - name: Guard agentctl dependency graph
        working-directory: ${{ github.workspace }}
        run: bash scripts/check-agentctl-deps.sh

      - name: Verify settings catalog contract
        working-directory: ${{ github.workspace }}
        run: node --test scripts/settings-contract-ci.test.mjs

      - name: Check required-store SQL portability
        run: go run ./cmd/sqlguard ./internal

      - name: Run catalog and SQLite conformance gates
        run: |
          set -euo pipefail
          go test -v -race ./internal/persistence/storeconformance \
            -run '^(TestStoreCatalogCompleteness|TestStoreConformance|TestUpgradeFixtureManifest|TestPreviousStableUpgrade)$'

      # Assert the run/dev/start-debug targets expand to the right per-shell
      # command line (native Windows / Git Bash / Unix). The windows-latest job
      # below compiles Go but never exercises this Make-target dispatch, so a
      # regression in the OS/MSYSTEM guards would otherwise ship unnoticed.
      - name: Check Makefile shell dispatch
        run: make check-make-shells

      - name: Check backend lint workflow contract
        run: node --test ../../scripts/backend-lint-workflow.test.mjs

      - name: Resolve base SHA
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref || github.event.repository.default_branch }}
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # On `pull_request` the checkout is the merge ref, whose first parent
          # is the current base branch tip. `pull_request.base.sha` is the base
          # tip from when the PR event fired, so it can be stale after main
          # advances. Use the merge ref's actual base tip to keep the diff and
          # incremental lint scoped to this PR.
          #
          # A merge_group run has no pull request behind it, so the queue branch
          # is cut from `merge_group.base_sha`, which is the equivalent base.
          # A manual run has no push before-SHA; compare it with the checked-out
          # main branch so incremental lint does not scan historical findings.
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            BASE_SHA="$(git merge-base HEAD "origin/${BASE_REF}")"
          elif [[ "${EVENT_NAME}" == "merge_group" ]]; then
            BASE_SHA="${MERGE_GROUP_BASE_SHA}"
          elif [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            BASE_SHA="$(git merge-base HEAD "origin/${BASE_REF}")"
          else
            BASE_SHA="${PUSH_BEFORE}"
          fi

          if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD)"
          fi

          echo "BASE_SHA=${BASE_SHA}" >> "$GITHUB_ENV"
          echo "Base SHA: ${BASE_SHA}"

      - name: Check SDK artifacts and clean consumers
        working-directory: ${{ github.workspace }}
        run: |
          node --test scripts/pluginsdk/consumer-smoke.test.mjs scripts/pluginsdk/check-proto-generation.test.mjs
          node scripts/pluginsdk/check-proto-generation.mjs
          node scripts/pluginsdk/consumer-smoke.mjs --mode local --backend-only

      - name: Test standalone plugin SDK
        working-directory: pluginsdk
        run: |
          go test -trimpath -race ./...
          go vet ./...
          golangci-lint run --config ../apps/backend/.golangci.yml ./...

      - name: Check gofmt
        shell: bash
        run: |
          set -euo pipefail

          CHANGED_GO_FILES="$(
            git diff --name-only --diff-filter=ACMRT "${BASE_SHA}...${{ github.sha }}" -- ':(top)apps/backend' \
            | grep -E '^apps/backend/.*\.go$' \
            || true
          )"

          if [[ -z "${CHANGED_GO_FILES}" ]]; then
            echo "No backend Go files changed."
            exit 0
          fi

          UNFORMATTED="$(echo "${CHANGED_GO_FILES}" | sed 's#^apps/backend/##' | xargs gofmt -l)"
          if [[ -n "${UNFORMATTED}" ]]; then
            echo "The following changed Go files are not formatted with gofmt:"
            echo "${UNFORMATTED}"
            exit 1
          fi

      - name: Run golangci-lint
        # golangci-lint is preinstalled in the kandev-ci image; invoke it
        # directly instead of going through `golangci/golangci-lint-action`,
        # which would re-download its own binary on every run. `--timeout=5m`
        # was too short for a cold cache; keep the explicit budget finite while
        # allowing the full repository analysis to finish reliably.
        shell: bash
        run: golangci-lint run ./... --new-from-rev="${BASE_SHA}" --timeout=15m

  test_shards:
    name: Backend Tests (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # Checkout receives the short-lived job token. Keep this credential-bearing
    # path on GitHub-hosted capacity during the external-runner pilot.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            index: 0
          - shard: 2
            index: 1
          - shard: 3
            index: 2
          - shard: 4
            index: 3
    # Pre-baked image bundles Go and jq, so test shards can start immediately
    # without repeating tool installation.
    container: ghcr.io/kdlbs/kandev-ci:build-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          # The runtime compatibility test builds the pinned pre-extraction SDK.
          fetch-depth: 0
          persist-credentials: false

      - name: Mark workspace safe for git
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go modules and compilation
        uses: ./.github/actions/cache-go
        with:
          family: test-${{ matrix.shard }}
          save-mode: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'build' || 'none' }}

      - name: Run tests
        env:
          SHARD_INDEX: ${{ matrix.index }}
          SHARD_NUMBER: ${{ matrix.shard }}
        run: |
          set -euo pipefail

          package_list="$(go list ./...)"
          if [[ -z "${package_list}" ]]; then
            echo "go list returned no backend packages"
            exit 1
          fi

          mapfile -t all_packages <<<"${package_list}"
          shard_packages=()
          for package in "${all_packages[@]}"; do
            # The required repository matrix owns this package's complete inventory.
            if [[ "${package}" == github.com/kandev/kandev/internal/task/repository/sqlite ]]; then continue; fi
            # Keep measured heavy integration packages on the otherwise light
            # third shard. All other packages retain stable hash allocation.
            case "${package}" in
              github.com/kandev/kandev/internal/backendapp|github.com/kandev/kandev/internal/agentctl/server/adapter/transport/acp|github.com/kandev/kandev/internal/coordinator)
                package_shard=2 ;;
              *)
                checksum="$(cksum <<<"${package}")"
                checksum="${checksum%% *}"
                package_shard=$(( checksum % 4 )) ;;
            esac
            if (( package_shard == SHARD_INDEX )); then
              shard_packages+=("${package}")
            fi
          done

          if (( ${#shard_packages[@]} == 0 )); then
            echo "Shard ${SHARD_NUMBER}/4 selected no packages"
            exit 1
          fi

          echo "Running ${#shard_packages[@]} packages in shard ${SHARD_NUMBER}/4"
          # Keep complete JSON for reports/artifacts while limiting live output
          # to compiler/process lines and package-level pass/fail summaries.
          go test \
            -race \
            -timeout=10m \
            -coverprofile="coverage-${SHARD_NUMBER}.out" \
            -covermode=atomic \
            -json \
            "${shard_packages[@]}" \
            2>&1 \
            | tee "test-results-${SHARD_NUMBER}.json" \
            | jq --unbuffered -Rr '
                . as $line
                | (try fromjson catch null) as $event
                | if $event == null then
                    $line
                  elif ($event.Test == null and ($event.Action == "pass" or $event.Action == "fail")) then
                    "\($event.Action): \($event.Package) (\($event.Elapsed // 0)s)"
                  else
                    empty
                  end
              '

      # Run the pinned reporter as a child process so its summary target can be
      # redirected. A `uses:` step cannot override GITHUB_STEP_SUMMARY because
      # the runner reapplies its own file-command environment to JS actions.
      - name: Checkout Go test reporter
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: always()
        with:
          repository: robherley/go-test-action
          ref: 2f859e0c8769d755d3174eecb9af8f64660827f3 # v1.1.0
          path: .github/vendor/go-test-action
          persist-credentials: false

      - name: Generate test report
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          BACKEND_TEST_SHARD: ${{ matrix.shard }}
        run: |
          report_summary="$RUNNER_TEMP/backend-test-summary-${BACKEND_TEST_SHARD}.md"
          : > "$report_summary"
          GITHUB_STEP_SUMMARY="$report_summary" \
          INPUT_FROMJSONFILE="$GITHUB_WORKSPACE/apps/backend/test-results-${BACKEND_TEST_SHARD}.json" \
          INPUT_MODULEDIRECTORY="$GITHUB_WORKSPACE/apps/backend" \
          INPUT_OMIT="successful" \
            node ".github/vendor/go-test-action/dist/index.js"

      - name: Publish bounded test report summary
        if: always()
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          BACKEND_TEST_SHARD: ${{ matrix.shard }}
        run: |
          python3 .github/scripts/bounded-step-summary.py \
            --input "$RUNNER_TEMP/backend-test-summary-${BACKEND_TEST_SHARD}.md" \
            --output "$GITHUB_STEP_SUMMARY" \
            --diagnostics-label "backend-test-results-${BACKEND_TEST_SHARD}" \
            --diagnostics-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID#artifacts"

      - name: Upload test artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-test-results-${{ matrix.shard }}
          path: |
            apps/backend/coverage-${{ matrix.shard }}.out
            apps/backend/test-results-${{ matrix.shard }}.json
          retention-days: 30

  repository_tests:
    name: Backend Repository (${{ matrix.shard }}/3)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    container: ghcr.io/kdlbs/kandev-ci:build-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/backend
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Mark workspace safe for git
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go modules and compilation
        uses: ./.github/actions/cache-go
        with:
          family: repository-${{ matrix.shard }}
          save-mode: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'build' || 'none' }}

      - name: Run repository cohort
        env:
          REPOSITORY_SHARD: ${{ matrix.shard }}
        run: >-
          python3 ../../.github/scripts/repository-test-shard.py
          --mode normal --shard "$REPOSITORY_SHARD"
          --output ".build/ci-repository-$REPOSITORY_SHARD"

      - name: Upload repository cohort evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-repository-${{ matrix.shard }}
          path: apps/backend/.build/ci-repository-${{ matrix.shard }}/
          if-no-files-found: error
          retention-days: 14

  test_ambient_env:
    name: Backend (ambient integration env)
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # Checkout receives the short-lived job token. Keep this credential-bearing
    # path on GitHub-hosted capacity during the external-runner pilot.
    runs-on: ubuntu-latest
    # test_shards runs in the same clean container and never sets these vars,
    # so it cannot catch a package that starts reading them again — the class
    # of bug that shipped alongside internal/gitlab's host-trust tests (they
    # only passed because CI never set KANDEV_GITLAB_HOST/GITLAB_HOST/
    # GITLAB_TOKEN), and that internal/github hit for real with an ambient
    # GH_TOKEN/GITHUB_TOKEN picking a PAT client over the "no auth configured"
    # path. This job poisons them with obviously-fake values so the GitLab-
    # and GitHub-facing packages are forced to prove they stay hermetic
    # instead of accidentally depending on an unset ambient env.
    container: ghcr.io/kdlbs/kandev-ci:build-latest
    defaults:
      run:
        shell: bash
        working-directory: apps/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Mark workspace safe for git
        shell: bash
        working-directory: ${{ github.workspace }}
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go modules and compilation
        uses: ./.github/actions/cache-go
        with:
          family: ambient
          save-mode: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'build' || 'none' }}

      - name: Run GitLab-facing packages under a poisoned host environment
        env:
          KANDEV_GITLAB_HOST: https://gitlab.ambient-ci.invalid
          GITLAB_HOST: https://gitlab.ambient-ci.invalid
          GITLAB_TOKEN: glpat-ambient-ci-not-a-real-token
        run: go test -race ./internal/gitlab/... ./internal/agentctl/server/process/...

      - name: Run GitHub-facing package under a poisoned ambient environment
        env:
          GH_TOKEN: ghp-ambient-ci-not-a-real-token
          KANDEV_MOCK_GITHUB: "true"
        run: GITHUB_TOKEN=ghp-ambient-ci-not-a-real-token-legacy go test -race ./internal/github/...

  # The required check. Runs on every event, including the ones where every job
  # above is correctly skipped, so the merge queue always has a conclusion to
  # read instead of a check that stays pending forever.
  #
  # `needs` covers every other job in this workflow on purpose. A merge queue
  # gates on check names an admin selects by hand, and a job missing from this
  # list is a job whose failure would never block a merge — silently, and
  # without appearing anywhere in the ruleset. `postgres-boot` and
  # `test-windows` were outside it before this workflow became a gate.
  test:
    name: Run Backend Tests
    runs-on: ${{ fromJSON(needs.changes.outputs.plan || '{"test_runner":"ubuntu-latest"}').test_runner }}
    needs:
      - changes
      - static_checks
      - sdk_builder
      - sdk_package
      - test_shards
      - repository_tests
      - test_ambient_env
      - postgres-boot
      - postgres-18
      - sidebar-resources
      - test-windows
    if: ${{ always() }}
    steps:
      - name: Verify required jobs and evidence
        if: always()
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUNNER_PLAN: ${{ needs.changes.outputs.plan }}
          RUN_REQUIRED: ${{ needs.changes.outputs.run }}
          SIDEBAR_REQUIRED: ${{ needs.changes.outputs.sidebar_resources }}
          SDK_PACKAGE_RESULT: ${{ needs.sdk_package.result }}
          SDK_BUILDER_RESULT: ${{ needs.sdk_builder.result }}
          STATIC_CHECKS_RESULT: ${{ needs.static_checks.result }}
          TEST_SHARDS_RESULT: ${{ needs.test_shards.result }}
          REPOSITORY_TESTS_RESULT: ${{ needs.repository_tests.result }}
          TEST_AMBIENT_ENV_RESULT: ${{ needs.test_ambient_env.result }}
          POSTGRES_BOOT_RESULT: ${{ needs['postgres-boot'].result }}
          POSTGRES_18_RESULT: ${{ needs['postgres-18'].result }}
          SIDEBAR_RESOURCES_RESULT: ${{ needs['sidebar-resources'].result }}
          TEST_WINDOWS_RESULT: ${{ needs['test-windows'].result }}
        run: |
          set -euo pipefail
          if [[ "${CHANGES_RESULT}" != "success" || -z "${RUNNER_PLAN}" ]]; then
            echo "Change detection or runner planning failed or produced no plan: ${CHANGES_RESULT}" >&2
            exit 1
          fi
          if [[ "${RUN_REQUIRED}" != "true" && "${RUN_REQUIRED}" != "false" ]]; then
            echo "Missing change-selection verdict." >&2
            exit 1
          fi
          expected=skipped
          if [[ "${RUN_REQUIRED}" == "true" ]]; then expected=success; fi
          for entry in \
            "sdk_package:${SDK_PACKAGE_RESULT}" \
            "sdk_builder:${SDK_BUILDER_RESULT}" \
            "static_checks:${STATIC_CHECKS_RESULT}" \
            "test_shards:${TEST_SHARDS_RESULT}" \
            "repository_tests:${REPOSITORY_TESTS_RESULT}" \
            "test_ambient_env:${TEST_AMBIENT_ENV_RESULT}" \
            "postgres-boot:${POSTGRES_BOOT_RESULT}" \
            "postgres-18:${POSTGRES_18_RESULT}" \
            "sidebar-resources:${SIDEBAR_RESOURCES_RESULT}" \
            "test-windows:${TEST_WINDOWS_RESULT}"; do
            name="${entry%%:*}"
            result="${entry#*:}"
            required="${expected}"
            if [[ "${name}" == "sidebar-resources" ]]; then
              case "${SIDEBAR_REQUIRED}" in
                true) required=success ;;
                false) required=skipped ;;
                *) echo "Missing sidebar selection verdict." >&2; exit 1 ;;
              esac
            fi
            if [[ "${result}" != "${required}" ]]; then
              echo "${name}: expected ${required}, got ${result}" >&2
              exit 1
            fi
          done

  postgres-boot:
    name: Backend Postgres (${{ matrix.cohort }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cohort: [packages, 1, 2, 3]
    permissions:
      contents: read
      packages: read
    # Million-event retention fixtures need the ninety-minute suite budget,
    # plus time for the service, cold compilation, and job cleanup.
    timeout-minutes: 120
    container: ghcr.io/kdlbs/kandev-ci:build-latest
    services:
      postgres:
        # Mirrored from the digest-pinned Docker Hub image by
        # ci-base-image.yml. Service images are pulled before steps begin, so
        # moving this pull to GHCR removes an otherwise unwrappable Docker Hub
        # timeout from job startup.
        image: ghcr.io/kdlbs/kandev-ci:postgres-16@sha256:fe03a7605299a34ddf5e4f285dff78c3d7190a576b3c6b46f2fcff69f4bffd54
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: kandev
          POSTGRES_PASSWORD: kandev
          POSTGRES_DB: kandev_admin
        # PostgreSQL parallel checks of million-row fixtures exceed Docker
        # default shared memory even after logical row retirement.
        options: >-
          --shm-size=256m
          --health-cmd "pg_isready -U kandev -d kandev_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: apps/backend
    env:
      KANDEV_TEST_POSTGRES_DSN: host=postgres port=5432 user=kandev password=kandev dbname=kandev_admin sslmode=disable

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Mark workspace safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache Go modules and compilation
        uses: ./.github/actions/cache-go
        with:
          family: postgres-${{ matrix.cohort }}
          save-mode: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'build' || 'none' }}

      - name: Run fixed PostgreSQL 16 persistence gates
        env:
          POSTGRES_COHORT: ${{ matrix.cohort }}
        run: |
          set -euo pipefail
          # Keep this package list explicit. PostgreSQL coverage is a reviewed
          # contract, not a grep over test source markers that can silently
          # omit a package when a test is renamed or moved.
          POSTGRES_PACKAGES=(
            ./internal/agent/settings/store
            ./internal/analytics/repository/sqlite
            ./internal/automation
            ./internal/azuredevops
            ./internal/backendapp
            ./internal/coordinator
            ./internal/coordinator/ledger
            ./internal/db
            ./internal/delivery
            ./internal/github
            ./internal/gitlab
            ./internal/jira
            ./internal/linear
            ./internal/notifications/store
            ./internal/office/configsync
            ./internal/office/repository/sqlite
            ./internal/office/retention
            ./internal/orchestrator/messagequeue
            ./internal/persistence
            ./internal/persistence/storeconformance
            ./internal/plugins/state
            ./internal/prompts/store
            ./internal/runs/service
            ./internal/runtimeflags
            ./internal/secrets
            ./internal/sentry
            ./internal/system/settings
            ./internal/system/storage
            ./internal/task/repository/sqlite
            ./internal/telemetrycontract
            ./internal/terminal/repository
            ./internal/user/store
            ./internal/workflow/repository
            ./internal/workflowsync
            ./internal/worktree
          )
          if [[ "$POSTGRES_COHORT" != packages ]]; then
            python3 ../../.github/scripts/repository-test-shard.py \
              --mode postgres --shard "$POSTGRES_COHORT" \
              --output ".build/ci-postgres-$POSTGRES_COHORT"
            exit 0
          fi
          # The required repository cohorts own this package, including the
          # existing -skip '^TestDeliveryRetentionStorage(ProtectedGap)?$/SQLite$'.
          ordinary_packages=()
          for package in "${POSTGRES_PACKAGES[@]}"; do
            [[ "${package}" == ./internal/task/repository/sqlite ]] || ordinary_packages+=("${package}")
          done
          go test -v -race -timeout 90m "${ordinary_packages[@]}"

      - name: Upload PostgreSQL repository evidence
        if: always() && matrix.cohort != 'packages'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-repository-${{ matrix.cohort }}
          path: apps/backend/.build/ci-postgres-${{ matrix.cohort }}/
          if-no-files-found: error
          retention-days: 14

  sidebar-resources:
    name: Sidebar resource bounds (${{ matrix.mode }})
    needs: changes
    if: needs.changes.outputs.sidebar_resources == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mode: [memory-1, memory-2, memory-3, timing]
    container: ghcr.io/kdlbs/kandev-ci:build-latest
    services:
      postgres:
        # Mirrored from the digest-pinned Docker Hub image by
        # ci-base-image.yml. Service images are pulled before steps begin, so
        # moving this pull to GHCR removes an otherwise unwrappable Docker Hub
        # timeout from job startup.
        image: ghcr.io/kdlbs/kandev-ci:postgres-16@sha256:fe03a7605299a34ddf5e4f285dff78c3d7190a576b3c6b46f2fcff69f4bffd54
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: kandev
          POSTGRES_PASSWORD: kandev
          POSTGRES_DB: kandev_admin
        options: >-
          --health-cmd "pg_isready -U kandev -d kandev_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: apps/backend
    env:
      KANDEV_TEST_POSTGRES_DSN: host=postgres port=5432 user=kandev password=kandev dbname=kandev_admin sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Restore sidebar Go compilation
        id: sidebar_go_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-sidebar-resources-${{ runner.os }}-${{ hashFiles('apps/backend/go.mod', 'apps/backend/go.sum', 'pluginsdk/go.mod', 'pluginsdk/go.sum') }}
          restore-keys: |
            go-sidebar-resources-${{ runner.os }}-
      - name: Measure isolated native memory and pooled retention
        if: startsWith(matrix.mode, 'memory-')
        env:
          KANDEV_SIDEBAR_MEMORY_MATRIX: "1"
          SIDEBAR_RESOURCE_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          case "$SIDEBAR_RESOURCE_MODE" in
            memory-1)
              selection=(-run '^TestSidebarQuery(PreparationMemory|PoolMemoryPlateau|MaximumInputMemory)$'
                -skip '^TestSidebarQueryPoolMemoryPlateau$/(state|updatedAt|createdAt|title|custom)$') ;;
            memory-2)
              selection=(-run '^TestSidebarQueryPoolMemoryPlateau$/(state|updatedAt)$') ;;
            memory-3)
              selection=(-run '^TestSidebarQueryPoolMemoryPlateau$/(createdAt|title|custom)$') ;;
            *) echo "Unknown memory group: $SIDEBAR_RESOURCE_MODE" >&2; exit 1 ;;
          esac
          go test -tags sqlite_fts5 -p 1 ./internal/task/repository/sqlite \
            "${selection[@]}" -timeout 45m -count=1 -json 2>&1 | tee sidebar-memory.log
      - name: Measure populated SQLite and PostgreSQL pages
        if: matrix.mode == 'timing'
        run: |
          set -euo pipefail
          go test -tags sqlite_fts5 -p 1 ./internal/task/repository/sqlite \
            -run '^Test(QuerySidebarTaskPage|SidebarQueryScratch|SidebarTaskViewConformance|SidebarLocalViewSQLiteConformance|SidebarTree|SidebarUniformAndMixedTreeStates|SidebarRepositoryProjection|SidebarPostgresJITSetting)' \
            -bench '^BenchmarkSidebarTaskPage100K$' \
            -benchtime=1x -timeout 15m -count=1 -v 2>&1 | tee sidebar-benchmark.log
      - name: Upload sidebar resource evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sidebar-resource-evidence-${{ matrix.mode }}
          path: apps/backend/sidebar-*.log
          retention-days: 30
      # Every mode compiles the same package. One writer avoids duplicate
      # compression/uploads; cached compilation never replaces native execution.
      - name: Save sidebar Go compilation
        if: success() && matrix.mode == 'memory-1' && steps.sidebar_go_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-sidebar-resources-${{ runner.os }}-${{ hashFiles('apps/backend/go.mod', 'apps/backend/go.sum', 'pluginsdk/go.mod', 'pluginsdk/go.sum') }}

  postgres-18:
    name: Backend Postgres 18
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    timeout-minutes: 20
    container: ghcr.io/kdlbs/kandev-ci:build-latest
    services:
      postgres:
        image: ghcr.io/kdlbs/kandev-ci:postgres-18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
        env:
          POSTGRES_USER: kandev
          POSTGRES_PASSWORD: kandev
          POSTGRES_DB: kandev_admin
        options: >-
          --health-cmd "pg_isready -U kandev -d kandev_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        shell: bash
        working-directory: apps/backend
    env:
      KANDEV_TEST_POSTGRES_DSN: host=postgres port=5432 user=kandev password=kandev dbname=kandev_admin sslmode=disable

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Run PostgreSQL 18 repository contract gates
        run: |
          set -euo pipefail
          output_file="$(mktemp)"
          go test -v -race \
            ./internal/task/repository/sqlite ./internal/office/repository/sqlite \
            -run '^(TestPostgresMaterializationSerializesAndRechecksOwner|TestPostgresWorkspaceGroupOwnershipRoundTrip|TestWorkspaceBindingRetryOwnership|TestPostgresQuickChatHistoryCAS|TestPostgresPrimaryPromotionAndStaleWrite|TestPostgresTurnEntryStampAcrossRevisit|TestPostgresTurnEntryReceiptStampAcrossRevisit|TestPostgresStateRepairRequiresCurrentEntry)$' \
            2>&1 | tee "${output_file}"

          for test_name in \
            TestPostgresMaterializationSerializesAndRechecksOwner \
            TestPostgresWorkspaceGroupOwnershipRoundTrip \
            TestWorkspaceBindingRetryOwnership \
            TestPostgresQuickChatHistoryCAS \
            TestPostgresPrimaryPromotionAndStaleWrite \
            TestPostgresTurnEntryStampAcrossRevisit \
            TestPostgresTurnEntryReceiptStampAcrossRevisit \
            TestPostgresStateRepairRequiresCurrentEntry; do
            if ! grep -q "^=== RUN   ${test_name}$" "${output_file}" || \
               ! grep -q "^--- PASS: ${test_name} " "${output_file}"; then
              echo "::error::PostgreSQL 18 repository gate did not run and pass ${test_name}"
              exit 1
            fi
          done

      - name: Run PostgreSQL 18 boot and upgrade gates
        run: |
          set -euo pipefail
          output_file="$(mktemp)"
          go test -v -race \
            ./internal/persistence/storeconformance ./internal/backendapp \
            -run '^(TestPreviousStableUpgrade|TestPostgresBootInitializesRepositories)$' \
            2>&1 | tee "${output_file}"

          for test_name in \
            '=== RUN   TestPreviousStableUpgrade' \
            '=== RUN   TestPostgresBootInitializesRepositories'; do
            if ! grep -q "^${test_name}$" "${output_file}"; then
              echo "::error::PostgreSQL 18 gate matched no ${test_name#*   } test"
              exit 1
            fi
          done

  test-windows:
    name: Backend (windows, ${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: windows-latest
    # Keep compilation, process, platform, persistence and settings work independent.
    # A cold Windows race build and test can exceed 60 minutes before cleanup.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: process, cohort: 1, label: process 1/4}
          - {suite: process, cohort: 2, label: process 2/4}
          - {suite: process, cohort: 3, label: process 3/4}
          - {suite: process, cohort: 4, label: process 4/4}
          - {suite: native, label: native}
          - {suite: compile, label: compile}
          - {suite: persistence, label: persistence}
          - {suite: settings, label: settings}
    # Least-privilege: this job only reads source and runs tests, no PR/issue
    # writes or release operations. Flagged by CodeQL workflow audit + matching
    # CodeRabbit nitpick.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Test Windows isolated instance safety
        if: matrix.suite == 'native'
        working-directory: ${{ github.workspace }}
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File scripts\tests\isolated-instance.Tests.ps1

      - name: Set up Go
        uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14 # v7.0.0 + upstream dependency refresh
        with:
          go-version-file: apps/backend/go.mod
          cache: false

      - name: Resolve Windows Go build cache
        id: windows_go_cache
        run: |
          $cachePath = go env GOCACHE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $goVersion = go env GOVERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $modulePath = go env GOMODCACHE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "path=$cachePath" >> $env:GITHUB_OUTPUT
          "version=$goVersion" >> $env:GITHUB_OUTPUT
          "modulePath=$modulePath" >> $env:GITHUB_OUTPUT
          "day=$([DateTime]::UtcNow.ToString('yyyy-MM-dd', [System.Globalization.CultureInfo]::InvariantCulture))" >> $env:GITHUB_OUTPUT

      - name: Cache Windows Go modules
        id: windows_module_cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.windows_go_cache.outputs.modulePath }}
          key: go-windows-modules-${{ runner.arch }}-${{ steps.windows_go_cache.outputs.version }}-${{ hashFiles('apps/backend/go.mod', 'apps/backend/go.sum', 'pluginsdk/go.mod', 'pluginsdk/go.sum') }}

      - name: Cache Windows compiled packages
        id: windows_build_cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.windows_go_cache.outputs.path }}
          key: go-windows-build-${{ matrix.suite }}-${{ runner.arch }}-${{ steps.windows_go_cache.outputs.version }}-${{ hashFiles('apps/backend/go.mod', 'apps/backend/go.sum', 'pluginsdk/go.mod', 'pluginsdk/go.sum') }}-${{ steps.windows_go_cache.outputs.day }}
          restore-keys: |
            go-windows-build-${{ matrix.suite }}-${{ runner.arch }}-${{ steps.windows_go_cache.outputs.version }}-${{ hashFiles('apps/backend/go.mod', 'apps/backend/go.sum', 'pluginsdk/go.mod', 'pluginsdk/go.sum') }}-

      - name: Compile Windows settings test packages
        if: matrix.suite == 'settings'
        timeout-minutes: 10
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 2GiB
        run: >-
          go test -trimpath -tags fts5 -race -p=2 -run '^$' -count=1 -timeout=30s
          ./internal/agent/settings/controller ./internal/agent/settings/handlers ./internal/agent/settings/store ./internal/backendapp ./internal/mcp/handlers ./internal/mcp/server ./internal/workflow/controller ./internal/workflow/handlers ./internal/workflow/repository

      - name: Compile Windows persistence test packages
        if: matrix.suite == 'persistence'
        # Cold race compilation can exceed ten minutes before tests start.
        timeout-minutes: 20
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 2GiB
        run: >-
          go test -trimpath -tags fts5 -race -p=2 -run '^$' -count=1 -timeout=30s
          ./internal/backendapp ./internal/orchestrator/executor ./internal/persistence/storeconformance ./internal/task/handlers ./internal/task/repository/sqlite ./internal/task/service

      - name: Test Windows copy-file glob tokenization
        if: matrix.suite == 'native'
        run: >-
          go test -race -v ./internal/worktree/copyfiles
          -run '^(TestParseSpecs_GlobTokenization|TestParseSpecs_NativeEscapes|TestCopyPlan_GlobTokenization|TestCopyPlan_UnclosedClassKeepsFollowingEntries|TestValidateSpec_GlobAdjacentSuffix)$'

      # Compile-checks every `*_windows.go` file (pty/conpty wrapper, job-object
      # launcher, shell, signals, sysprocattr, vscode cleanup, …). The rest of
      # the suite is build-tag-gated out automatically.
      - name: Build
        if: matrix.suite == 'compile'
        run: go build ./...

      - name: Vet
        if: matrix.suite == 'compile'
        run: go vet ./...

      - name: Test Windows process cohort runner
        if: matrix.suite == 'process'
        run: go test -race -timeout 25m ./cmd/windows-process-tests

      - name: Test Windows process package
        if: matrix.suite == 'process'
        env:
          WINDOWS_PROCESS_COHORT: ${{ matrix.cohort }}
        run: go run ./cmd/windows-process-tests -cohorts 4 -cohort $env:WINDOWS_PROCESS_COHORT

      # Scope to packages with non-trivial Windows-specific code paths.
      # Tests that genuinely cannot run on Windows (Unix sockets, POSIX
      # symlinks under default Windows ACLs, delete-while-open) call t.Skip
      # in source with a documented reason. The shell-fixture tests now use
      # a self-hosting Go helper (see testmain_test.go) so they run on
      # every platform.
      - name: Test windows-sensitive packages
        if: matrix.suite == 'native'
        run: go test -race -v -json -timeout 25m ./internal/agent/runtime/agentctl/launcher/... ./internal/common/ptyexec/... ./internal/backendapp/ownershiplock/... ./internal/system/storage/workspaces/... ./cmd/kandev/... ./cmd/winjob/...

      - name: Test Windows recovery mode preservation
        if: matrix.suite == 'native'
        run: go test -tags fts5 -race -v -json -timeout 25m -run '^TestRecoverySnapshotPreservesWindowsReadOnlyMode$' ./internal/worktree

      - name: Test Windows Git executable memo
        if: matrix.suite == 'native'
        run: go test -tags fts5 -race -v -timeout 10m ./internal/common/subproc -run '^TestNewGitCommand'

      - name: Test Windows Hermes ACP detection
        if: matrix.suite == 'native'
        timeout-minutes: 10
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 2GiB
        run: go test -trimpath -tags fts5 -race -p=1 -count=1 -v -timeout 5m ./internal/agent/agents -run '^Test(HermesACP|RunCommandCheck)'

      # Keep this targeted: these packages have broader tests, while these
      # native tests verify hidden consoles retain handles for descendants.
      - name: Test Windows helper console behavior
        if: matrix.suite == 'native'
        run: >-
          go test -tags fts5 -race -v
          -run '^(TestWindowsPrepareGitLifecycleCommandHidesConsoleWindow|TestWindowsDetachedParentKeepsConsoleHiddenForDescendants|TestPrepareNativeMCPProcessHidesConsoleWindow|TestWindowsACPCommandProcAttrHidesConsoleWindow|TestConfigureProcessTreeHidesConsoleWindow)$'
          ./internal/common/subproc ./internal/agent/mcpconfig ./internal/agentctl/server/utility ./internal/agent/acpdbg ./internal/agent/codexdbg

      - name: Test Windows runtime observation command shims
        if: matrix.suite == 'native'
        run: go test -race -v ./internal/agentctl/server/utility -run '^TestRuntimeObservationRunsWindowsCommandShimWithSpaces$'

      - name: Test Windows generic wrapper preparation
        if: matrix.suite == 'native'
        run: go test -race -v ./internal/common/launchwrapper ./internal/common/managednpm

      - name: Test Windows managed runtime cache repair
        if: matrix.suite == 'native'
        run: go test -race -v ./internal/agent/managedruntime -run TestRemoveNpxExecutionTreeTreatsMissingWindowsChildAsAbsent

      # Keep port-collision coverage targeted: the instance package contains
      # broader stdio MCP fixture tests that depend on Unix command behavior.
      - name: Test Windows port collision handling
        if: matrix.suite == 'native'
        shell: bash
        run: |
          go test -race -v ./internal/common/netutil -run '^TestIsAddrInUse'
          go test -race -v ./internal/agentctl/server/instance -run '^TestAllocatePortAndListenerRetriesAddressInUse$'
          go test -race -v ./internal/gateway/websocket -run '^TestResolveAndBindReportsOccupiedPort$'

      - name: Test Windows loopback listeners
        if: matrix.suite == 'native'
        shell: bash
        run: |
          set -euo pipefail
          go test -race -v -timeout 10m ./internal/common/portutil ./internal/common/netprobe ./internal/agentctl/server/config ./cmd/plugin-fixture
          go test -race -v -timeout 10m ./internal/gateway/websocket -run 'Tunnel|ResolveAndBind|ConcurrentFailingStarts'
          go test -race -v -timeout 10m ./internal/launcher -run 'TestPickPorts|TestPickDevPorts|TestCanBind|TestWaitForHealthBypassesHTTPProxyForSpecificBind'
          go test -race -v -timeout 10m ./internal/agentctl/server/api -run '^(TestHandleVscodeStart_Success|TestHandleVscodeStatus_AfterStart|TestVscodeOpenFile_WaitsForRunning_E2E)$'

      # Keep this targeted: the service package has broad subprocess coverage,
      # while this native test is the Windows path-semantics regression.
      - name: Test Windows path semantics
        if: matrix.suite == 'native'
        run: >-
          go test -race -v
          -run '^(TestExplicitLocalRepositoryWindowsPathSemantics|TestListDirectory.*|TestDriveRootsFromMask|TestSplitAbsForRoot)$'
          ./internal/task/service

      - name: Test Windows document attachment publication
        if: matrix.suite == 'persistence'
        timeout-minutes: 6
        run: |
          $env:GOMAXPROCS = '2'
          $env:GOMEMLIMIT = '2GiB'
          go test -trimpath -tags fts5 -race -p 1 ./internal/task/service -run '^TestDocumentAttachment.*$' -count=1 -timeout=4m -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Windows profile enabled omission
        if: matrix.suite == 'settings'
        timeout-minutes: 6
        run: |
          $env:GOMAXPROCS = '2'
          $env:GOMEMLIMIT = '2GiB'
          go test -trimpath -tags fts5 -race -p 1 -count=1 -timeout=4m -v ./internal/agent/settings/store ./internal/agent/settings/controller ./internal/agent/settings/handlers ./internal/mcp/server ./internal/backendapp -run '^(TestProfileEnabledIntent(Caller|OwnCommit|Controls|DynamicCaller|DynamicRejection|Storage|HTTP|MCP|Compact)|TestUpdateAgentProfileModelIfEmptyIsConditional|TestUpdateAgentProfile_DoesNotOverwriteWorkingOwner|TestAgentProfileEnabled_RoundTrip|TestDynamicProfileCreateAndUpdatePersistsCandidates|TestSQLiteRepositoryDynamicProfileCRUDUsesOptimisticVersions)$'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Windows executor profile scripts
        if: matrix.suite == 'persistence'
        timeout-minutes: 6
        run: |
          $env:GOMAXPROCS = '2'
          $env:GOMEMLIMIT = '2GiB'
          go test -trimpath -tags fts5 -race -p=1 -count=1 -timeout=4m -v -run '^(TestExecutorProfileScripts(IndependentSQLite|Presence|OwnCommit|Storage|Failures|Compatibility|SettingsDomain|ApplyProfile|StoreConformance)|TestRegisteredExecutorProfileScripts(HTTP|WS))$' ./internal/task/service ./internal/task/repository/sqlite ./internal/task/handlers ./internal/backendapp ./internal/orchestrator/executor ./internal/persistence/storeconformance
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Keep SQLite path coverage targeted: other tests in these packages
      # assert POSIX file modes or depend on Git path output.
      - name: Test Windows SQLite database paths
        if: matrix.suite == 'native'
        shell: bash
        run: |
          go test -race -tags fts5 -v ./internal/system/backups -run '^TestVerifySnapshotOpensNativeAbsolutePath$'
          go test -race -tags fts5 -v ./internal/task/inventoryrepair -run '^TestOpenDatabase(Reads|Writes)NativeAbsolutePath$'

      - name: Test Windows workspace settings persistence
        if: matrix.suite == 'persistence'
        timeout-minutes: 30
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 2GiB
        run: >-
          go test -trimpath -tags fts5 -race -p=1 -count=1 -json -timeout=5m
          -run '^Test(WorkspaceFieldUpdates(ConcurrentSQLite|PresenceAndDefaults|ExactFenceSQLite|AdmissionAndFailures|Storage)|RegisteredWorkspaceFieldUpdates(HTTP|WS))$'
          ./internal/task/service ./internal/task/repository/sqlite ./internal/task/handlers

      - name: Test Windows workflow start selection
        if: matrix.suite == 'settings'
        timeout-minutes: 6
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 2GiB
        run: |
          go test -trimpath -tags fts5 -race -p=1 -count=1 -json -timeout=4m -run '^TestWorkflowStartSelection(ControllerOmission|ControllerControls|SQLiteIndependentStores|RepositoryRollback|LegacyAndExact|RegisteredREST|AccessFailures|RegisteredMCP)$' ./internal/workflow/controller ./internal/workflow/repository ./internal/workflow/handlers ./internal/mcp/handlers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Windows repository checkout defaults
        if: matrix.suite == 'persistence'
        timeout-minutes: 6
        env:
          GOMAXPROCS: '2'
          GOMEMLIMIT: 2GiB
        run: |
          go test -trimpath -tags fts5 -race -p=1 -count=1 -json -timeout=4m -run '^Test(RepositoryCheckoutDefaults(ConcurrentSQLite|Presence|CompanionAtomicity|OwnMutationProjection|Failures|Storage|LegacyAndExact)|RegisteredRepositoryCheckoutDefaults(HTTP|WS))$' ./internal/task/service ./internal/task/repository/sqlite ./internal/task/handlers
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test Cursor project slug path normalization
        if: matrix.suite == 'native'
        run: go test -race -v ./internal/agent/mcpconfig -run '^TestDeriveCursorProjectSlug$'

      # Pure GOOS-branch logic (no syscalls), but it must actually observe
      # Windows to prove the unavailable branch, not just compile under it.
      - name: Test Windows agent-survival flag availability
        if: matrix.suite == 'native'
        run: go test -race -v -run '^TestAgentSurvivalAvailabilityMatchesPlatformScope$' ./internal/runtimeflags

      - name: Save Windows Go modules
        if: success() && matrix.suite == 'compile' && steps.windows_module_cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.windows_go_cache.outputs.modulePath }}
          key: ${{ steps.windows_module_cache.outputs.cache-primary-key }}

      - name: Save Windows compiled packages
        if: success() && steps.windows_build_cache.outputs.cache-hit != 'true' && (matrix.suite != 'process' || matrix.cohort == 1)
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.windows_go_cache.outputs.path }}
          key: ${{ steps.windows_build_cache.outputs.cache-primary-key }}
