name: PR4502 Pagination Cohort Proof
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: pr4502-pagination-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  pagination-proof:
    name: PR4502 pagination and desktop/mobile search controls (retries0)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ghcr.io/kdlbs/kandev-ci@sha256:98444d487323ba66213ba1dd7b8abf8c0de727df3f17587c37c81dbb45175295
      options: --ipc=host
    defaults:
      run:
        shell: bash
    env:
      COREPACK_HOME: /root/.cache/node/corepack
      NODE_OPTIONS: --dns-result-order=ipv4first
      SOURCE_REVISION: d3d4ab5b41df7a3c8b164e24de3987895e8a62c7
    steps:
      - name: Checkout exact published production source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: d3d4ab5b41df7a3c8b164e24de3987895e8a62c7
          persist-credentials: false
      - name: Verify exact source and record tools
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD)" = "$SOURCE_REVISION"
          git -c safe.directory="$GITHUB_WORKSPACE" ls-tree -r HEAD > source-tree.txt
          go version
          node --version
          pnpm --version
      - name: Install exact locked dependencies
        working-directory: apps
        run: pnpm install --frozen-lockfile
      - name: Build real backend, frontend and required fixtures
        run: |
          set -euo pipefail
          VERSION="0.0.0-e2e.${SOURCE_REVISION}" make -C apps/backend build-kandev build-agentctl build-agentctl-linux build-mock-agent &
          backend_pid=$!
          make build-web-e2e &
          web_pid=$!
          backend_status=0
          wait "$backend_pid" || backend_status=$?
          web_status=0
          wait "$web_pid" || web_status=$?
          test "$backend_status" = 0
          test "$web_status" = 0
          make build-e2e-delivery-fixture
          make -C apps/backend e2e-plugin-ui e2e-plugin-package
      - name: Record immutable build identity
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const {createHash} = require('node:crypto');
          const path = require('node:path');
          const base = path.resolve('apps/backend');
          const files = ['bin/kandev','bin/mock-agent','bin/e2e-delivery-fixture','bin/agentctl-linux-amd64','.build/kandev-plugin-e2e-1.0.0.tar.gz'];
          const artifacts = Object.fromEntries(files.map(f => [f,createHash('sha256').update(fs.readFileSync(path.join(base,f))).digest('hex')]));
          fs.writeFileSync(path.join(base,'bin/e2e-build-identity.json'), JSON.stringify({schema_version:1,source_revision:process.env.SOURCE_REVISION,artifacts},null,2)+'\n');
          NODE
      - name: Run changed pagination case and real desktop/mobile positive controls once
        working-directory: apps/web
        env:
          KANDEV_E2E_BUILD_IDENTITY: ${{ github.workspace }}/apps/backend/bin/e2e-build-identity.json
          KANDEV_E2E_EXPECTED_SOURCE_REVISION: d3d4ab5b41df7a3c8b164e24de3987895e8a62c7
          KANDEV_E2E_WS_ASSERT: "1"
        run: |
          set -euo pipefail
          pnpm e2e:raw tests/task/task-list.spec.ts tests/task/mobile-task-list-search.spec.ts \
            --project=chromium --project=mobile-chrome \
            --grep 'pagination shows totals, rows per page, and page numbers|search resets the page and clear retains selected filters|phone latest search resets pagination and retains its filters' \
            --retries=0 --reporter=json 2>&1 | tee pagination-proof.json
      - name: Retain source binding and actual browser output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr4502-pagination-proof
          path: |
            source-tree.txt
            apps/backend/bin/e2e-build-identity.json
            apps/web/pagination-proof.json
            apps/web/e2e/test-results/
          if-no-files-found: error
          retention-days: 30
