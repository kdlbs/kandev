name: PR4503 required static batch and pagination GREEN
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14
        with:
          go-version-file: apps/backend/go.mod
          cache: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Install locked dependencies
        working-directory: apps
        run: pnpm install --frozen-lockfile
      - name: Preserved queue API error and admission unit cohort
        working-directory: apps/web
        run: pnpm exec vitest run lib/api/domains/queue-api.test.ts lib/api/domains/queue-api-errors.test.ts lib/queue-mutation-error.test.ts
      - name: Install Chromium
        if: always()
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Desktop corrected pagination and queue retry contracts
        if: always()
        working-directory: apps/web
        run: pnpm e2e:run --host --project chromium -- tests/chat/queue-admission-busy.spec.ts tests/task/task-list.spec.ts --grep 'queue busy feedback preserves entries and permits retry|pagination shows totals, rows per page, and page numbers' --retries=0 --output=e2e/test-results-pr4503-static-desktop
      - name: Phone search and queue retry controls
        if: always()
        working-directory: apps/web
        run: pnpm e2e:run --host --no-build --project mobile-chrome -- tests/chat/mobile-queue-admission-busy.spec.ts tests/task/mobile-task-list-search.spec.ts --grep 'mobile queue busy feedback preserves entries and permits retry|menu search action reveals, filters, and clears on collapse' --retries=0 --output=e2e/test-results-pr4503-static-phone
      - name: Preserve browser diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr4503-static-batch-browser-evidence
          path: |
            apps/web/e2e/test-results-pr4503-static-desktop/
            apps/web/e2e/test-results-pr4503-static-phone/
            apps/web/e2e/blob-report/
          if-no-files-found: warn
