name: PR4502 Notification Preservation Proof

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: pr4502-notification-proof-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notification-proof:
    name: PR4502 affected MCP notification cases
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: ghcr.io/kdlbs/kandev-ci@sha256:98444d487323ba66213ba1dd7b8abf8c0de727df3f17587c37c81dbb45175295
    defaults:
      run:
        shell: bash
        working-directory: apps/backend
    steps:
      - name: Checkout exact proof source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact source and toolchain
        run: |
          git -c safe.directory="$GITHUB_WORKSPACE" rev-parse HEAD
          go version
      - name: Run affected production packages and positive controls
        run: |
          set -euo pipefail
          go test -trimpath -race -count=1 -timeout=3m -json \
            ./internal/mcp/server ./internal/backendapp \
            -run '^(TestSupplementNotificationProtocolVersion_(PreservesAmbiguousMembers|AddsMetadata|LeavesOtherMessagesUntouched)|TestStreamableHTTPHandler_(DoesNotWrapModernToolRequests|NotificationWithoutMethodHeader|PreservesDuplicateParamsValidation|AcceptsHeaderOnlyModernNotification|KeepsSDKValidation|ForwardsBodyReadErrors|DoesNotReadBodyBeforeTransportChecks|BypassesNonModernRequests)|TestRegisteredMCPRoutes_NotificationThenToolUse|TestNotificationBody_ForwardsReadAndCloseErrors|TestExternalMCPNotification_AuthenticatesBeforeBodyRead)$' \
            2>&1 | tee notification-proof.jsonl
      - name: Retain exact proof output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr4502-notification-proof
          path: apps/backend/notification-proof.jsonl
          if-no-files-found: error
          retention-days: 30
