name: PR4503 corrected desktop and phone GREEN proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14
        with:
          go-version-file: apps/backend/go.mod
          cache: false
      - uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288
        with:
          version: 9.15.9
          run_install: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
      - name: Install locked dependencies
        working-directory: apps
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: always()
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      - name: Desktop busy refusal and real successful retry
        if: always()
        working-directory: apps/web
        run: pnpm e2e:run --host --project chromium -- tests/chat/queue-admission-busy.spec.ts --retries=0 --output=e2e/test-results-pr4503-desktop
      - name: Phone busy refusal and real successful retry
        if: always()
        working-directory: apps/web
        run: pnpm e2e:run --host --no-build --project mobile-chrome -- tests/chat/mobile-queue-admission-busy.spec.ts --retries=0 --output=e2e/test-results-pr4503-phone
      - name: Validate durable documentation
        if: always()
        run: |
          python3 scripts/list-docs.py validate
          python3 scripts/lint-spec-files.py --all
      - name: Preserve browser diagnostics and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr4503-focused-browser-evidence
          path: |
            apps/web/e2e/test-results-pr4503-desktop/
            apps/web/e2e/test-results-pr4503-phone/
            apps/web/e2e/blob-report/
          if-no-files-found: warn
