syntax = "proto3";

package kandev.plugin.v1;

import "google/protobuf/struct.proto";

option go_package = "github.com/kandev/kandev/proto/kandev/plugin/v1;pluginv1";

// Implemented by the PLUGIN. kandev is the client.
service Plugin {
  rpc DeliverEvent(Event) returns (EventAck);
  rpc HandleWebhook(WebhookRequest) returns (WebhookResponse);
  // Browser-originated calls reach this method only through Kandev's
  // authenticated declared-action route. Context is host-verified; body is
  // bounded untrusted JSON.
  rpc HandleAction(PluginActionRequest) returns (PluginActionResponse);
  // Dynamic composer-reference operations. Candidate identity is untrusted;
  // the host owns canonical references and reauthorizes on submission.
  rpc SearchEntityReferences(SearchEntityReferencesRequest) returns (SearchEntityReferencesResponse);
  rpc AuthorizeEntityReference(AuthorizeEntityReferenceRequest) returns (AuthorizeEntityReferenceResponse);
  // Optional resolver for manifest-owned repository providers. Returned
  // credentials are transient and never persisted by the host.
  rpc ResolveGitCredential(ResolveGitCredentialRequest) returns (ResolveGitCredentialResponse);
  // Optional non-secret credential revision for an exact resolver scope.
  // The host stores this opaque value in a lease and compares it before and
  // after credential redemption so a rotated or disconnected provider fails
  // closed without resolving a secret merely to inspect its revision.
  rpc GetGitCredentialBinding(GitCredentialBindingRequest) returns (GitCredentialBindingResponse);
  rpc InvokeAgentTool(AgentToolRequest) returns (AgentToolResponse);
}

// Implemented by KANDEV (served back over the go-plugin broker).
// Reads (§5) and writes are capability-gated server-side by an inline
// per-resource check at the start of each handler — there is no unary
// interceptor enforcing this centrally.
//
// Host data API (ADR 0043): the read/write data RPCs below live on this same
// `service Host` rather than a separate `service HostData`. They reuse the
// single broker connection; splitting into a second service would only
// duplicate that for no benefit. Reads require manifest capability
// `api_read:<resource>`; writes require `api_write:<resource>` (e.g.
// `api_read:tasks`, `api_write:comments`). An undeclared capability returns
// gRPC PermissionDenied with `capability 'api_read:tasks' not declared` (or
// `api_write:tasks`, etc.).
//
// DTOs below are a HAND-DEFINED public contract: the backend maps internal
// models → these messages explicitly, never generates them from domain
// structs, and never marshals domain structs through google.protobuf.Struct.
// Fields are additive-only after merge (ADR 0043); removing or renaming a
// field is a breaking change requiring a new api_version. Read handlers call
// the relevant service (never a repository directly); write handlers call
// service methods that publish task.* events (never repository.TaskRepository).
service Host {
  rpc GetState(GetStateRequest) returns (GetStateResponse);
  rpc SetState(SetStateRequest) returns (SetStateResponse);
  rpc DeleteState(DeleteStateRequest) returns (DeleteStateResponse);
  rpc ListState(ListStateRequest) returns (ListStateResponse);
  rpc RevealSecret(RevealSecretRequest) returns (RevealSecretResponse);
  rpc EmitEvent(EmitEventRequest) returns (EmitEventResponse);

  // Plugin-scoped secret primitives — capability `secrets`, like
  // RevealSecret. Keys are namespaced server-side to the calling plugin
  // (vault id "plugin:<id>:secret:<key>"), so a plugin can only ever read,
  // write, or delete its OWN secrets; RevealSecret remains the way to
  // resolve an operator-provided reference to a shared/global secret.
  // Values are stored in kandev's encrypted secret vault (AES-256-GCM at
  // rest), never on the plugin record or config file.
  rpc GetSecret(GetSecretRequest) returns (GetSecretResponse);
  rpc SetSecret(SetSecretRequest) returns (SetSecretResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);

  // GetConfig returns the plugin's own operator-editable config (the values
  // set in Settings > Plugins > <plugin> against the manifest's
  // config_schema). Ungated: a plugin can always read its own config, secret
  // values included — that is how e.g. an operator-configured PAT reaches
  // the plugin.
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);

  // Reads — capability api_read:<resource>
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc ListWorkspaces(ListWorkspacesRequest) returns (ListWorkspacesResponse);
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  rpc ListWorkflowSteps(ListWorkflowStepsRequest) returns (ListWorkflowStepsResponse);
  rpc ListAgentProfiles(ListAgentProfilesRequest) returns (ListAgentProfilesResponse);
  rpc ListExecutorProfiles(ListExecutorProfilesRequest) returns (ListExecutorProfilesResponse);
  rpc ListRepositories(ListRepositoriesRequest) returns (ListRepositoriesResponse);

  // Sessions + code stats — capability api_read:sessions. Driven by a real
  // plugin (kandev-plugin-agent-stats) that otherwise read task_sessions,
  // task_session_commits, and task_session_git_snapshots straight from the
  // SQLite file. SessionCodeStats is a COMPUTED, stable DTO — deliberately
  // not the raw commit/snapshot rows, whose JSON schema churns.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc ListSessionCodeStats(ListSessionCodeStatsRequest) returns (ListSessionCodeStatsResponse);

  // Conversation content — capability api_read:messages. Historical
  // user/agent message content for a session or task, filterable by a time
  // range (e.g. "yesterday"). Content is sanitized: kandev-injected
  // <kandev-system> blocks are stripped, exactly like the message.added bus
  // event — raw system prompts are never exposed to plugins.
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);

  // Pending agent interactions — capability api_read:interactions. The
  // DURABLE record of every permission request and clarification bundle still
  // owed a human response, under the same turn/session authority kandev's own
  // list surfaces use. Session state alone cannot answer this: WAITING_FOR_INPUT
  // also describes an ordinarily completed turn, so a state-only consumer
  // reports attention that is not owed. Reading the record is what lets a
  // consumer that started late, restarted, or missed an event reconcile.
  // GetInteraction resolves ANY interaction — including terminal ones — so a
  // replayed or missed event converges on the current result instead of
  // NotFound.
  rpc ListPendingInteractions(ListPendingInteractionsRequest) returns (ListPendingInteractionsResponse);
  rpc GetInteraction(GetInteractionRequest) returns (GetInteractionResponse);

  // Utility agent — capability agent_invoke. Runs a one-shot, non-interactive
  // completion using the operator-configured "utility agent" profile (Settings
  // > System), so a plugin can delegate a lightweight LLM step without holding
  // its own API key. FailedPrecondition when no utility agent is configured.
  rpc InvokeUtilityAgent(InvokeUtilityAgentRequest) returns (InvokeUtilityAgentResponse);

  // Writes — capability api_write:<resource>. Route through the first-party
  // service layer so events fire and WS clients update — the whole reason not
  // to let plugins write the DB. CreateTask/UpdateTask require api_write:tasks
  // and go through the task service (task.* events; kandev stamps
  // source = "plugin:<id>" on created rows, a plugin cannot set it). SendMessage
  // requires api_write:messages and delivers a prompt to a task session through
  // the orchestrator — the same delivery path message_task uses (queue when the
  // session is running, resume/start it otherwise).
  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse);
  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse);
  // MoveTask transitions a task to a workflow step through the same path the
  // board's own move uses (validation, WIP admission, task.moved publication,
  // auto-start gates, queue reconciliation) — unlike UpdateTask, which rejects
  // workflow_step_id. Requires api_write:tasks.
  rpc MoveTask(MoveTaskRequest) returns (MoveTaskResponse);
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc PreviewPluginOwnedTaskTree(PreviewPluginOwnedTaskTreeRequest) returns (PreviewPluginOwnedTaskTreeResponse);
  rpc DeletePluginOwnedTaskTree(DeletePluginOwnedTaskTreeRequest) returns (DeletePluginOwnedTaskTreeResponse);

  // Interaction responses — capability api_write:interactions. Each routes
  // through the same first-party service the native UI uses, so the agent
  // unblocks, the durable record turns terminal, and every surface converges
  // through the normal events. Terminal-once: an interaction that already has
  // a resolution answers FailedPrecondition rather than dispatching a second
  // response, and an unknown id answers NotFound — the two outcomes a
  // reconciling cache needs to distinguish "someone else got there first" from
  // "I am holding a stale id".
  rpc RespondToPermission(RespondToPermissionRequest) returns (RespondToPermissionResponse);
  rpc AnswerClarification(AnswerClarificationRequest) returns (AnswerClarificationResponse);
  rpc CancelClarification(CancelClarificationRequest) returns (CancelClarificationResponse);
}

message Event {
  string event_id = 1; // fresh uuid per delivery
  string event_type = 2; // bus subject, e.g. "task.created"
  string occurred_at = 3; // RFC3339 UTC
  string workspace_id = 4; // empty if not derivable
  google.protobuf.Struct payload = 5; // marshaled bus event.Data
}
message EventAck {}

message AgentToolRequest {
  string invocation_id = 1;
  string name = 2;
  google.protobuf.Struct arguments = 3;
  AgentToolContext context = 4;
}
message AgentToolContext {
  string task_id = 1;
  string session_id = 2;
  string workspace_id = 3;
  string surface = 4;
}
message AgentToolResponse {
  string text = 1;
  google.protobuf.Struct structured_content = 2;
  bool is_error = 3;
}

message WebhookRequest {
  string webhook_key = 1;
  string method = 2;
  string path = 3; // remainder after the key
  string query = 4;
  map<string, string> headers = 5; // single-valued; multi joined by ", "
  bytes body = 6;
}
message WebhookResponse {
  int32 status = 1;
  map<string, string> headers = 2;
  bytes body = 3;
}

// VerifiedActionContext is derived after normal HTTP authentication and
// resource authorization; plugins must never infer authority from body.
message PluginActionRequest {
  string action_key = 1;
  VerifiedActionContext context = 2;
  bytes body = 3;
}
message VerifiedActionContext {
  string actor_id = 1;
  string workspace_id = 2;
  string task_id = 3;
  string repository_id = 4;
  string session_id = 5;
  string head_branch = 6;
}
message PluginActionResponse {
  bytes body = 1;
  map<string, string> headers = 2;
  // Final HTTP status. Zero preserves compatibility and means 200.
  int32 status = 3;
}

message SearchEntityReferencesRequest {
  string source = 1;
  string workspace_id = 2;
  string query = 3;
  int32 limit = 4;
}
message SearchEntityReferencesResponse {
  repeated EntityReferenceCandidate candidates = 1;
}
message EntityReferenceCandidate {
  string provider_local_id = 1;
  string title = 2;
  string url = 3;
  google.protobuf.Struct attributes = 4;
}
message AuthorizeEntityReferenceRequest {
  string source = 1;
  string workspace_id = 2;
  string purpose = 3;
  google.protobuf.Struct reference = 4;
}
message AuthorizeEntityReferenceResponse {
  bool allowed = 1;
  string reason = 2;
}

message ResolveGitCredentialRequest {
  string provider_id = 1;
  string workspace_id = 2;
  string task_id = 3;
  string session_id = 4;
  string repository_id = 5;
  string host = 6;
  string path = 7;
}
message ResolveGitCredentialResponse {
  string username = 1;
  string secret = 2;
  string expires_at = 3;
}

message GitCredentialBindingRequest {
  string provider_id = 1;
  string workspace_id = 2;
  string task_id = 3;
  string session_id = 4;
  string repository_id = 5;
  string host = 6;
  string path = 7;
}
message GitCredentialBindingResponse {
  string binding = 1;
}

message GetStateRequest {
  string scope = 1;
  string scope_id = 2;
  string key = 3;
}
message GetStateResponse {
  bool found = 1;
  google.protobuf.Struct value = 2;
}
message SetStateRequest {
  string scope = 1;
  string scope_id = 2;
  string key = 3;
  google.protobuf.Struct value = 4;
}
message SetStateResponse {}
message DeleteStateRequest {
  string scope = 1;
  string scope_id = 2;
  string key = 3;
}
message DeleteStateResponse {}
message ListStateRequest {
  string scope = 1;
  string scope_id = 2;
}
message ListStateResponse {
  repeated StateEntry entries = 1;
}
message StateEntry {
  string key = 1;
  google.protobuf.Struct value = 2;
  string updated_at = 3;
}

message GetConfigRequest {}
message GetConfigResponse {
  google.protobuf.Struct config = 1;
}

message GetSecretRequest {
  string key = 1;
}
message GetSecretResponse {
  bool found = 1;
  string value = 2;
}
message SetSecretRequest {
  string key = 1;
  string value = 2;
}
message SetSecretResponse {}
message DeleteSecretRequest {
  string key = 1;
}
message DeleteSecretResponse {}

message RevealSecretRequest {
  string ref = 1;
}
message RevealSecretResponse {
  string value = 1;
}

message EmitEventRequest {
  string event_name = 1;
  google.protobuf.Struct payload = 2;
}
message EmitEventResponse {}

// ── Host data API (ADR 0043) ─────────────────────────────────────────────────
// Pagination is opaque-cursor based so the server can change the underlying
// ordering/store without breaking plugins.
message Page {
  int32 limit = 1;   // 0 → server default (e.g. 50); server caps the max
  string cursor = 2; // empty → first page; echo next_cursor to continue
}
message PageInfo {
  string next_cursor = 1;
  bool has_more = 2;
}

// Timestamps are RFC3339 strings (matches the JSON API + the Event envelope
// convention above), not protobuf Timestamp, to keep one time representation
// across the whole plugin contract. Optional string fields use `optional` so
// absent (NULL) is distinguishable from empty.

// ── Task ────────────────────────────────────────────────────────────────────
message Task {
  string id = 1;
  string workspace_id = 2;
  string workflow_id = 3;
  string title = 4;
  string description = 5;
  string state = 6; // TaskState enum value as a string, stable
  string priority = 7;
  string created_by = 8;
  string created_at = 9; // RFC3339
  string updated_at = 10;
  optional string started_at = 11;
  optional string completed_at = 12;
  optional string parent_id = 13;
  string identifier = 14;
  bool is_ephemeral = 15;
  repeated TaskRepository repositories = 16;
  google.protobuf.Struct metadata = 17; // free-form; plugin-tolerant
  // RFC3339, set only when the task is archived. Present so a plugin reading
  // with include_archived can tell a live task from a retired one; absent is
  // the normal case, not an unknown.
  optional string archived_at = 18;
  // Pull requests opened for this task, newest first. A plugin that reports on
  // delivery cannot otherwise get from a task to its change: the link lives in
  // github_task_prs, and neither the checkout branch (which is the BASE branch)
  // nor the title (rewritten to conventional-commit form on the PR) matches.
  repeated TaskPullRequest pull_requests = 19;
  // The step the task currently stands on, and its order within that step.
  // Without these a plugin can read a task's State (created/in progress/review/
  // completed) but not WHERE on the board it is, so it cannot render, group by,
  // or reason about a workflow at all.
  string workflow_step_id = 20;
  int32 position = 21;
  // The agent profile running this task, empty when unassigned. Canonically a
  // `runner` row in workflow_step_participants (ADR 0005 Wave F); this is the
  // same read-time projection kandev's own callers consume.
  string assignee_agent_profile_id = 22;
  // Task labels. Stored as a JSON array string on the model; carried here as a
  // real repeated field so a plugin does not have to re-parse it.
  repeated string labels = 23;
  bool autopilot = 24;
  // Whether the task consumes a slot in its current step's WIP capacity. A
  // queued task stays visible but admits nothing, so a capacity report that
  // counted rows rather than this would over-count.
  bool wip_admitted = 25;
  string queued_for_step_id = 26;
  optional string queued_at = 27; // RFC3339
  // Office project this task belongs to, empty for kanban-board tasks.
  string project_id = 28;
  // Caller-supplied create-idempotency key, empty when the task holds none.
  string external_id = 29;
}
message TaskRepository {
  string id = 1;
  string repository_id = 2;
  string base_branch = 3;
  int32 position = 4;
  string checkout_branch = 5;
}
// TaskPullRequest is the read-side view of a task's linked pull request. It
// carries provider-neutral fields only; provider-specific review metadata stays
// out of the plugin contract.
message TaskPullRequest {
  int64 number = 1;
  string url = 2;
  string title = 3;
  string state = 4; // "open" | "closed" | "merged"
  string head_branch = 5;
  string base_branch = 6;
  bool is_draft = 7;
  string provider = 8; // "github" | "gitlab"
  optional string merged_at = 9; // RFC3339
  // Readiness, already synced by kandev's own PR watcher. A plugin reporting on
  // what can merge would otherwise re-fetch every one of these from the forge
  // per pull request, which is both slower and rate-limited.
  string review_state = 10; // approved | changes_requested | pending | ""
  string checks_state = 11; // success | failure | pending | ""
  string mergeable_state = 12; // clean | blocked | behind | dirty | unstable | draft | unknown | ""
  int32 unresolved_review_threads = 13;
  int32 checks_total = 14;
  int32 checks_passing = 15;
  int32 additions = 16;
  int32 deletions = 17;
  string author_login = 18;
  optional string closed_at = 19; // RFC3339
}

message TaskFilter {
  repeated string workspace_ids = 1; // empty → all the plugin may see
  repeated string workflow_ids = 2;
  repeated string states = 3;
  optional string parent_id = 4;
  bool include_ephemeral = 5; // default false (kanban-visible only)
  // default false, matching the previous hardcoded behaviour: a plugin that
  // does not ask still sees only live tasks.
  bool include_archived = 6;
}
message ListTasksRequest {
  TaskFilter filter = 1;
  Page page = 2;
}
message ListTasksResponse {
  repeated Task tasks = 1;
  PageInfo page_info = 2;
}
message GetTaskRequest {
  string id = 1;
}
message GetTaskResponse {
  Task task = 1;
}

// ── Workspace / Workflow / Steps ─────────────────────────────────────────────
message Workspace {
  string id = 1;
  string name = 2;
  optional string description = 3;
  string owner_id = 4;
  optional string default_executor_id = 5;
  optional string default_agent_profile_id = 6;
  string created_at = 7;
  string updated_at = 8;
}
message ListWorkspacesRequest {
  Page page = 1;
}
message ListWorkspacesResponse {
  repeated Workspace workspaces = 1;
  PageInfo page_info = 2;
}

message Workflow {
  string id = 1;
  string workspace_id = 2;
  string name = 3;
  optional string description = 4;
  int32 sort_order = 5;
  string created_at = 6;
  string updated_at = 7;
}
message ListWorkflowsRequest {
  string workspace_id = 1;
  Page page = 2;
}
message ListWorkflowsResponse {
  repeated Workflow workflows = 1;
  PageInfo page_info = 2;
}

message WorkflowStep {
  string id = 1;
  string workflow_id = 2;
  string name = 3;
  int32 position = 4;
  string stage_type = 5; // work | review | approval | custom
  // Presentation and capacity, so a plugin rendering a board reads the same
  // step colour the operator already sees rather than inventing its own, and
  // can report a step against its own WIP limit.
  string color = 6;
  bool is_start_step = 7;
  int32 wip_limit = 8; // 0 means unlimited
  // The agent profile this step runs work under, empty when it inherits.
  string agent_profile_id = 9;
  // The on_enter action TYPES configured on this step, as authored
  // (e.g. "auto_start_agent", "queue_run"), so a plugin can describe this
  // step's intent instead of guessing from the step name or stage_type.
  // A type appearing here means it is configured, not a guarantee of when
  // or whether it fires. Session-independent actions use step-entry dispatch,
  // while session-shaped actions use route-specific session handling. Some
  // auto_start_agent paths create the required session instead of requiring
  // one to already exist. Action config is deliberately not exposed: it
  // carries target task ids, payloads and profile ids. Plugins must ignore
  // action types they do not recognize.
  repeated string on_enter_action_types = 10;
}
message ListWorkflowStepsRequest {
  string workflow_id = 1;
}
message ListWorkflowStepsResponse {
  repeated WorkflowStep steps = 1;
}

// ── Agent profiles / Repositories (read-only context) ────────────────────────
message AgentProfile {
  string id = 1;
  string agent_id = 2;
  string display_name = 3;
  string name = 4;
  string model = 5;
  string mode = 6;
}
message ListAgentProfilesRequest {
  Page page = 1;
}
message ListAgentProfilesResponse {
  repeated AgentProfile profiles = 1;
  PageInfo page_info = 2;
}

message ExecutorProfile {
  string id = 1;
  string display_name = 2;
  string executor_type = 3;
}
message ListExecutorProfilesRequest {
  Page page = 1;
}
message ListExecutorProfilesResponse {
  repeated ExecutorProfile profiles = 1;
  PageInfo page_info = 2;
}

message Repository {
  string id = 1;
  string workspace_id = 2;
  string name = 3; // owner/repo slug when known, else name
  optional string default_branch = 4;
  // Provider origin identity and credential-free clone URL. These deliberately
  // exclude local paths, scripts, and credentials.
  string source_type = 5;
  string provider_id = 6;
  string provider_repository_id = 7;
  string provider_host = 8;
  string owner_or_project = 9;
  string provider_name = 10;
  string remote_url = 11;
  // Opaque provider-defined connection scope. Together with
  // provider_repository_id this is the durable upstream identity; the host
  // never derives it from provider_host or clone_url.
  string provider_scope = 12;
}
message ListRepositoriesRequest {
  string workspace_id = 1;
  Page page = 2;
}
message ListRepositoriesResponse {
  repeated Repository repositories = 1;
  PageInfo page_info = 2;
}

// ── Sessions ─────────────────────────────────────────────────────────────────
// Identity + agent context for one agent run on a task. acp_session_id is the
// join key an external usage tool (e.g. tokscale) uses to attribute tokens —
// so kandev exposes it and stays out of the token business entirely.
//
// acp_session_id resolution (host-side, not the plugin's concern): read
// session metadata key `$.acp.session_id` first; if absent, fall back to
// `executors_running.resume_token` for the session's agent execution. Either
// source may be empty for a session that never reached the ACP handshake, in
// which case acp_session_id is returned empty.
message Session {
  string id = 1;
  string task_id = 2;
  string agent_profile_id = 3;
  string agent_display_name = 4; // from the profile snapshot at run time
  string model = 5;              // resolved model at run time
  string acp_session_id = 6;     // external usage-attribution join key
  string state = 7;
  string started_at = 8;
  optional string ended_at = 9;
  string agent_profile_name = 10; // profile name from the snapshot at run time
}
message SessionFilter {
  repeated string task_ids = 1;
  repeated string workspace_ids = 2;
  repeated string states = 3;
}
message ListSessionsRequest {
  SessionFilter filter = 1;
  Page page = 2;
}
message ListSessionsResponse {
  repeated Session sessions = 1;
  PageInfo page_info = 2;
}

// Computed code metrics per session — the aggregate the agent-stats plugin
// re-derived by hand from commits + git snapshots. Exposed as a stable shape
// so plugins never touch task_session_commits / task_session_git_snapshots.
message SessionCodeStats {
  string session_id = 1;
  int64 lines_added_committed = 2;     // SUM of commit insertions
  int64 lines_deleted_committed = 3;   // SUM of commit deletions
  int64 lines_added_peak_pending = 4;  // peak uncommitted diff additions across snapshots
  int64 lines_deleted_peak_pending = 5;
  // False (with lines_added_committed/lines_deleted_committed reading 0) for
  // a session that predates commit-capture activation and has no observed
  // commits — capture wasn't running yet, so a plugin must not treat that
  // zero as "zero lines changed". Kept as a separate additive field, rather
  // than making the existing fields 2/3 `optional`, because fields 2/3 are
  // an already-shipped part of this DTO's public contract (see ADR 0043:
  // "DTO fields are additive-only thereafter") — plugin authors read them as
  // plain int64 in the generated Go SDK, and switching that Go field type to
  // *int64 is a source-level break for anyone rebuilding against a new SDK,
  // even though the wire-level `optional` change itself is protobuf-safe.
  bool committed_lines_available = 6;
}
message ListSessionCodeStatsRequest {
  SessionFilter filter = 1;
  Page page = 2;
}
message ListSessionCodeStatsResponse {
  repeated SessionCodeStats stats = 1;
  PageInfo page_info = 2;
}

// ── Messages (conversation content) ──────────────────────────────────────────
// One user/agent message in a session's transcript. content has kandev's
// injected <kandev-system> blocks stripped; raw system content is never sent.
// author_type is "user" or "agent" (there is no "system" author — system
// context is inline markup that is removed at read time). type is the message
// kind ("message", "content", "tool_call", "thinking", ...).
message Message {
  string id = 1;
  string session_id = 2;
  string task_id = 3;
  string turn_id = 4;
  string author_type = 5; // "user" | "agent"
  string content = 6;     // <kandev-system> blocks stripped
  string type = 7;        // "message" default; see MessageType
  string created_at = 8;  // RFC3339
}
message MessageFilter {
  repeated string session_ids = 1; // empty → not constrained by session
  repeated string task_ids = 2;    // empty → not constrained by task
  optional string since = 3;       // RFC3339 inclusive lower bound on created_at
  optional string until = 4;       // RFC3339 exclusive upper bound on created_at
  repeated string types = 5;       // empty → all message types
}
message ListMessagesRequest {
  MessageFilter filter = 1;
  Page page = 2;
}
message ListMessagesResponse {
  repeated Message messages = 1;
  PageInfo page_info = 2;
}

// ── Pending interactions (api_read/api_write:interactions) ───────────────────
//
// One Interaction is one thing a human still owes an answer to: a tool
// permission request, or a whole clarification bundle (its per-question rows
// collapsed into `questions`). `id` is the pending id every response RPC keys
// on, and the same id the permission_request.received / clarification.* bus
// events and the persisted request messages carry — that shared key is what an
// event-driven cache reconciles its snapshot against.
message InteractionOption {
  string option_id = 1;
  string label = 2;
  // ACP permission-option kind ("allow_once" | "allow_always" |
  // "reject_once" | "reject_always") on a permission; empty on a
  // clarification option.
  string kind = 3;
  // Longer explanation of a clarification option; empty on a permission.
  string description = 4;
}
message InteractionQuestion {
  string id = 1;
  string title = 2;
  string prompt = 3;
  repeated InteractionOption options = 4;
}
message Interaction {
  string id = 1;   // pending id
  string kind = 2; // "permission" | "clarification"
  string task_id = 3;
  string session_id = 4;
  string turn_id = 5;
  // "pending" | "approved" | "rejected" | "answered" | "cancelled" | "expired".
  // Anything other than "pending" is terminal and no longer answerable. A
  // clarification bundle is only terminal once every question is.
  string status = 6;
  string title = 7;   // permission prompt, or the bundle's first question
  string context = 8; // shared clarification context; empty on a permission
  string tool_call_id = 9;
  string action_type = 10;
  repeated InteractionOption options = 11;     // permission options
  repeated InteractionQuestion questions = 12; // clarification questions
  // A still-pending clarification whose original waiter has gone away (the
  // agent moved on, or kandev restarted). Still answerable — the answer
  // resumes the session in a NEW turn — so this is not a resolution.
  bool agent_disconnected = 13;
  string created_at = 14; // RFC3339
  string updated_at = 15; // RFC3339
}
message InteractionFilter {
  repeated string session_ids = 1; // empty → not constrained by session
  repeated string task_ids = 2;    // empty → not constrained by task
  repeated string kinds = 3;       // empty → both kinds
}
message ListPendingInteractionsRequest {
  InteractionFilter filter = 1;
  Page page = 2;
}
message ListPendingInteractionsResponse {
  repeated Interaction interactions = 1;
  PageInfo page_info = 2;
}
message GetInteractionRequest {
  string id = 1;
}
message GetInteractionResponse {
  Interaction interaction = 1;
}

// ── Interaction responses (api_write:interactions) ───────────────────────────
message RespondToPermissionRequest {
  string id = 1; // pending id
  // Must name one of the interaction's declared options. kandev derives the
  // approve/deny outcome from that option's kind, so a plugin cannot report an
  // outcome the agent never offered.
  string option_id = 2;
  // Dismiss the request instead of selecting an option (the ACP "cancelled"
  // outcome). option_id must be empty when this is set.
  bool cancelled = 3;
}
message RespondToPermissionResponse {
  Interaction interaction = 1; // the interaction in its new terminal state
}
message ClarificationAnswer {
  string question_id = 1;
  repeated string selected_options = 2; // option ids
  string custom_text = 3;
}
message AnswerClarificationRequest {
  string id = 1; // pending id
  // Exactly one answer per question in the bundle; the agent stays blocked
  // until every question is answered.
  repeated ClarificationAnswer answers = 2;
}
message AnswerClarificationResponse {
  Interaction interaction = 1;
}
message CancelClarificationRequest {
  string id = 1; // pending id
  string reason = 2; // surfaced to the agent as the decline reason
}
message CancelClarificationResponse {
  Interaction interaction = 1;
}

// ── Utility agent invocation (agent_invoke) ──────────────────────────────────
// A one-shot completion delegated to the operator-configured utility agent.
// Adding fields here (e.g. a future system_prompt or max_tokens) is the
// forward-compatible extension path — the SDK method stays source-stable.
message InvokeUtilityAgentRequest {
  string prompt = 1;
}
message InvokeUtilityAgentResponse {
  string text = 1;
}

// ── Writes (api_write) ───────────────────────────────────────────────────────
message CreateTaskRequest {
  string workspace_id = 1;
  string workflow_id = 2;
  optional string workflow_step_id = 3;
  string title = 4;
  string description = 5;
  optional string parent_id = 6;
  bool start_agent = 7;
  // kandev stamps source = "plugin:<id>" server-side; not settable here.
  repeated PluginTaskRepository repositories = 8;
  optional PluginTaskLaunchOptions launch = 9;
  google.protobuf.Struct metadata = 10; // plugin namespace only; host reserves source.
}
message PluginTaskRepository {
  string repository_id = 1; // existing Kandev repository, or empty with remote below
  optional RemoteRepositoryDescriptor remote = 2;
  optional string base_branch = 3;
  optional string checkout_branch = 4;
  optional int64 pull_request_number = 5;
}
message RemoteRepositoryDescriptor {
  string provider_id = 1;
  string provider_host = 2;
  string owner_or_project = 3;
  string provider_repository_id = 4;
  string name = 5;
  string clone_url = 6; // exact credential-free URL; host never reconstructs it
  optional string default_branch = 7;
  optional string base_branch = 8;
  optional string head_branch = 9;
  optional int64 pull_request_number = 10;
  // Opaque provider-defined connection scope. It must be stable for one
  // configured provider instance and contain no credentials.
  string provider_scope = 11;
}
message PluginTaskLaunchOptions {
  optional string agent_profile_id = 1;
  optional string executor_profile_id = 2;
  optional string prompt = 3;
  optional string plan_mode = 4;
}
message CreateTaskResponse {
  Task task = 1;
}
message UpdateTaskRequest {
  string id = 1;
  optional string title = 2;
  optional string description = 3;
  optional string state = 4;
  optional string workflow_step_id = 5;
}
message UpdateTaskResponse {
  Task task = 1;
}
// MoveTask transitions a task to a workflow step. workflow_id is optional:
// omitted inherits the task's current workflow, present-empty is rejected.
// position is not optional: an omitted position and a position of zero are
// the same request, both placing the task at the top of the target step.
message MoveTaskRequest {
  string task_id = 1;
  string workflow_step_id = 2;
  optional string workflow_id = 3;
  int32 position = 4;
}
// transitioned reports whether a ledger row was written for this move
// (false when the task was already on the target step). queued_for_step_id
// is the sole admission discriminator, reported on both values of
// transitioned: absent means admitted (when transitioned) or not applicable
// (when not), present means queued for that step holding no WIP slot.
// from_step_id is the step the task left; empty when transitioned is false.
message MoveTaskResponse {
  Task task = 1;
  bool transitioned = 2;
  optional string queued_for_step_id = 3;
  string from_step_id = 4;
}
// SendMessage delivers a prompt to a task session (api_write:messages). The
// server records a user message stamped source = "plugin:<id>" and dispatches
// it through the orchestrator, resolving session_id (empty → the task's primary
// session) and handling session state: a running session queues the message;
// an idle/completed session is resumed and prompted; a never-started session is
// launched with it as the first prompt.
message SendMessageRequest {
  string task_id = 1;
  string session_id = 2; // empty → the task's primary session
  string text = 3;
}
message SendMessageResponse {
  string session_id = 1; // the session the message was delivered to
  string status = 2;     // "queued" | "sent" | "started"
}

message PreviewPluginOwnedTaskTreeRequest {
  string root_task_id = 1;
}
message PreviewPluginOwnedTaskTreeResponse {
  repeated Task tasks = 1;
}
message DeletePluginOwnedTaskTreeRequest {
  string root_task_id = 1;
}
message DeletePluginOwnedTaskTreeResponse {
  repeated string deleted_task_ids = 1;
}
// Attached to a non-OK DeletePluginOwnedTaskTree gRPC status when one or more
// descendants were already deleted. Callers must reconcile these ids before
// retrying the remaining idempotent cleanup.
message DeletePluginOwnedTaskTreeProgress {
  repeated string deleted_task_ids = 1;
}
