<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <title>Kandev</title>
    <style>
      :root {
        --bg: #f8fafc;
        --fg: #0f172a;
        --muted: #475569;
        --accent: #4338ca;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #09090b;
          --fg: #f4f4f5;
          --muted: #a1a1aa;
          --accent: #818cf8;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--fg);
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          sans-serif;
        text-align: center;
        padding: 16px;
        box-sizing: border-box;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 16px;
      }
      h1 {
        font-size: 1.25rem;
        margin: 16px 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        max-width: 28rem;
      }
      button {
        min-height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        color: var(--bg);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/web-app-manifest-192x192.png" alt="" width="72" height="72" />
      <h1 id="offline-title"></h1>
      <p id="offline-description"></p>
      <button id="offline-retry" type="button" onclick="location.reload()"></button>
    </main>
    <!-- OFFLINE_COPY_SCRIPT -->
  </body>
</html>
