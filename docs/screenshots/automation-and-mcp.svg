<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="automation-and-mcp-title automation-and-mcp-desc" width="1200" height="560">
      <title id="automation-and-mcp-title">One firing becomes a durable run</title>
      <desc id="automation-and-mcp-desc">A schedule, GitHub event, webhook, or manual trigger fires an automation. The automation creates an AutomationRun, starts a new task or continues a session, and records the turn in automation history.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="automation-mcp-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1a1"/></marker>
        <marker id="automation-mcp-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#53eafd"/></marker>
        <marker id="automation-mcp-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6468f0"/></marker>
      </defs>
      <rect width="1200" height="560" fill="#0d0d10"/>

      <!-- Zones are ownership boundaries, not extra workflow steps. -->
      <rect x="40" y="88" width="220" height="304" rx="8" fill="#111114" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect x="280" y="88" width="420" height="304" rx="8" fill="#111114" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect x="720" y="88" width="200" height="304" rx="8" fill="#111114" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect x="960" y="88" width="200" height="304" rx="8" fill="#111114" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
      <rect x="56" y="92" width="144" height="14" rx="2" fill="#0d0d10"/>
      <text x="128" y="102" text-anchor="middle" fill="#737373" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">SIGNAL SOURCES</text>
      <rect x="296" y="92" width="136" height="14" rx="2" fill="#0d0d10"/>
      <text x="364" y="102" text-anchor="middle" fill="#737373" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">KANDEV CONTROL</text>
      <rect x="736" y="92" width="120" height="14" rx="2" fill="#0d0d10"/>
      <text x="796" y="102" text-anchor="middle" fill="#737373" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">TASK RUNTIME</text>
      <rect x="976" y="92" width="120" height="14" rx="2" fill="#0d0d10"/>
      <text x="1036" y="102" text-anchor="middle" fill="#737373" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">HISTORY</text>

      <!-- Connectors are painted before nodes. -->
      <path d="M232 244 H292 Q300 244 300 236 V176 Q300 168 308 168 H320" fill="none" stroke="#53eafd" stroke-width="1.2" marker-end="url(#automation-mcp-arrow-link)"/>
      <path d="M400 208 V272" fill="none" stroke="#a1a1a1" stroke-width="1.2" marker-end="url(#automation-mcp-arrow)"/>
      <path d="M480 308 H744" fill="none" stroke="#6468f0" stroke-width="1.4" marker-end="url(#automation-mcp-arrow-accent)"/>
      <path d="M904 308 H984" fill="none" stroke="#53eafd" stroke-width="1.2" marker-end="url(#automation-mcp-arrow-link)"/>

      <!-- Connector labels sit in open space with paper masks. -->
      <rect x="236" y="214" width="48" height="12" rx="2" fill="#0d0d10"/>
      <text x="260" y="223" text-anchor="middle" fill="#53eafd" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">FIRE</text>
      <rect x="416" y="228" width="72" height="12" rx="2" fill="#0d0d10"/>
      <text x="452" y="237" fill="#a1a1a1" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">CREATE RUN</text>
      <rect x="548" y="286" width="160" height="12" rx="2" fill="#0d0d10"/>
      <text x="628" y="295" text-anchor="middle" fill="#6468f0" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">NEW TASK / CONTINUE</text>
      <rect x="912" y="286" width="64" height="12" rx="2" fill="#0d0d10"/>
      <text x="944" y="295" text-anchor="middle" fill="#53eafd" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">RECORD</text>

      <g role="group" aria-label="Schedule, provider event, webhook, or manual trigger">
        <rect x="72" y="208" width="160" height="72" rx="6" fill="#111114" stroke="#404040" stroke-width="1"/>
        <rect x="80" y="216" width="56" height="12" rx="2" fill="transparent" stroke="rgba(255,255,255,0.28)" stroke-width="0.8"/>
        <text x="108" y="225" text-anchor="middle" fill="#a1a1a1" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.08em">INPUT</text>
        <text x="152" y="246" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600" font-family="'Figtree','Geist',sans-serif">Trigger</text>
        <text x="152" y="266" text-anchor="middle" fill="#737373" font-size="9" font-family="'Geist Mono',monospace">schedule · PR · webhook</text>
      </g>
      <g role="group" aria-label="Workspace automation configuration">
        <rect x="320" y="136" width="160" height="72" rx="6" fill="#111114" stroke="#404040" stroke-width="1"/>
        <rect x="328" y="144" width="64" height="12" rx="2" fill="transparent" stroke="rgba(255,255,255,0.28)" stroke-width="0.8"/>
        <text x="360" y="153" text-anchor="middle" fill="#a1a1a1" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.08em">CONFIG</text>
        <text x="400" y="174" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600" font-family="'Figtree','Geist',sans-serif">Automation</text>
        <text x="400" y="194" text-anchor="middle" fill="#737373" font-size="9" font-family="'Geist Mono',monospace">prompt · profiles · scope</text>
      </g>
      <g role="group" aria-label="AutomationRun record">
        <rect x="320" y="272" width="160" height="72" rx="6" fill="rgba(100,104,240,0.16)" stroke="#6468f0" stroke-width="1.2"/>
        <rect x="328" y="280" width="56" height="12" rx="2" fill="transparent" stroke="rgba(100,104,240,0.60)" stroke-width="0.8"/>
        <text x="356" y="289" text-anchor="middle" fill="#6468f0" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.08em">RUN</text>
        <text x="400" y="310" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600" font-family="'Figtree','Geist',sans-serif">AutomationRun</text>
        <text x="400" y="330" text-anchor="middle" fill="#a1a1a1" font-size="9" font-family="'Geist Mono',monospace">task · session · turn</text>
      </g>
      <g role="group" aria-label="Task or continued agent session">
        <rect x="744" y="272" width="160" height="72" rx="6" fill="#111114" stroke="#404040" stroke-width="1"/>
        <rect x="752" y="280" width="56" height="12" rx="2" fill="transparent" stroke="rgba(255,255,255,0.28)" stroke-width="0.8"/>
        <text x="780" y="289" text-anchor="middle" fill="#a1a1a1" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.08em">SESSION</text>
        <text x="824" y="310" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600" font-family="'Figtree','Geist',sans-serif">Task or session</text>
        <text x="824" y="330" text-anchor="middle" fill="#737373" font-size="9" font-family="'Geist Mono',monospace">worktree · scratch · MCP</text>
      </g>
      <g role="group" aria-label="Automation history entry">
        <rect x="984" y="272" width="160" height="72" rx="6" fill="#111114" stroke="#404040" stroke-width="1"/>
        <rect x="992" y="280" width="56" height="12" rx="2" fill="transparent" stroke="rgba(255,255,255,0.28)" stroke-width="0.8"/>
        <text x="1020" y="289" text-anchor="middle" fill="#a1a1a1" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.08em">LOG</text>
        <text x="1064" y="310" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600" font-family="'Figtree','Geist',sans-serif">Run history</text>
        <text x="1064" y="330" text-anchor="middle" fill="#737373" font-size="9" font-family="'Geist Mono',monospace">transcript · status · reply</text>
      </g>

      <line x1="40" y1="432" x2="1160" y2="432" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
      <line x1="64" y1="458" x2="96" y2="458" stroke="#53eafd" stroke-width="1.2" marker-end="url(#automation-mcp-arrow-link)"/>
      <text x="112" y="462" fill="#a1a1a1" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.06em">EXTERNAL SIGNAL</text>
      <line x1="296" y1="458" x2="328" y2="458" stroke="#6468f0" stroke-width="1.4" marker-end="url(#automation-mcp-arrow-accent)"/>
      <text x="344" y="462" fill="#6468f0" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.06em">RUN IDENTITY</text>
      <text x="560" y="462" fill="#737373" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.06em">ONE FIRING = ONE TRACEABLE THREAD</text>
    </svg>
