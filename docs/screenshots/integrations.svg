<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="integrations-title integrations-desc" width="1200" height="560">
      <title id="integrations-title">Three credential paths stay separate</title>
      <desc id="integrations-desc">Three horizontal paths show a workspace integration reaching a provider API, an executor Git credential reaching a repository remote, and an agent credential reaching an agent CLI. The paths share a task launch but remain separate.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="integrations-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a1a1a1"/></marker>
        <marker id="integrations-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#53eafd"/></marker>
        <marker id="integrations-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6468f0"/></marker>
      </defs>
      <rect width="1200" height="560" fill="#0d0d10"/>

      <rect x="40" y="88" width="480" height="352" rx="8" fill="#111114" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="56" y="92" width="168" height="14" rx="2" fill="#0d0d10"/>
      <text x="140" y="102" text-anchor="middle" fill="#737373" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">CONFIGURATION SOURCES</text>
      <rect x="680" y="88" width="480" height="352" rx="8" fill="#111114" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="696" y="92" width="136" height="14" rx="2" fill="#0d0d10"/>
      <text x="764" y="102" text-anchor="middle" fill="#737373" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.14em">RUNTIME DESTINATIONS</text>

      <line x1="40" y1="184" x2="1160" y2="184" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
      <line x1="40" y1="300" x2="1160" y2="300" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
      <line x1="40" y1="416" x2="1160" y2="416" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
      <text x="56" y="168" fill="#737373" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.12em">PROVIDER ACCESS</text>
      <text x="56" y="284" fill="#737373" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.12em">GIT TRANSPORT</text>
      <text x="56" y="400" fill="#737373" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.12em">AGENT STARTUP</text>

      <!-- Each route has its own connector; no path is shared. -->
      <line x1="304" y1="208" x2="896" y2="208" stroke="#53eafd" stroke-width="1.2" marker-end="url(#integrations-arrow-link)"/>
      <line x1="304" y1="324" x2="896" y2="324" stroke="#a1a1a1" stroke-width="1.2" marker-end="url(#integrations-arrow)"/>
      <line x1="304" y1="440" x2="896" y2="440" stroke="#a1a1a1" stroke-width="1.2" marker-end="url(#integrations-arrow)"/>
      <rect x="560" y="190" width="80" height="12" rx="2" fill="#0d0d10"/>
      <text x="600" y="199" text-anchor="middle" fill="#53eafd" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">API CALLS</text>
      <rect x="560" y="306" width="80" height="12" rx="2" fill="#0d0d10"/>
      <text x="600" y="315" text-anchor="middle" fill="#a1a1a1" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">FETCH · PUSH</text>
      <rect x="560" y="422" width="80" height="12" rx="2" fill="#0d0d10"/>
      <text x="600" y="431" text-anchor="middle" fill="#a1a1a1" font-size="8" font-family="'Geist Mono',monospace" letter-spacing="0.06em">LAUNCH</text>

      <g role="group" aria-label="Workspace provider integration">
        <rect x="72" y="184" width="232" height="48" rx="6" fill="rgba(100,104,240,0.16)" stroke="#6468f0" stroke-width="1.2"/>
        <rect x="80" y="192" width="72" height="12" rx="2" fill="transparent" stroke="rgba(100,104,240,0.60)" stroke-width="0.8"/>
        <text x="116" y="201" text-anchor="middle" fill="#6468f0" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.08em">WORKSPACE</text>
        <text x="188" y="214" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600" font-family="'Figtree','Geist',sans-serif">Provider integration</text>
      </g>
      <g role="group" aria-label="Executor Git credential">
        <rect x="72" y="300" width="232" height="48" rx="6" fill="#111114" stroke="#404040" stroke-width="1"/>
        <rect x="80" y="308" width="72" height="12" rx="2" fill="transparent" stroke="rgba(255,255,255,0.28)" stroke-width="0.8"/>
        <text x="116" y="317" text-anchor="middle" fill="#a1a1a1" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.08em">EXECUTOR</text>
        <text x="188" y="330" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600" font-family="'Figtree','Geist',sans-serif">Git credential</text>
      </g>
      <g role="group" aria-label="Agent credential from an agent profile">
        <rect x="72" y="416" width="232" height="48" rx="6" fill="#111114" stroke="#404040" stroke-width="1"/>
        <rect x="80" y="424" width="72" height="12" rx="2" fill="transparent" stroke="rgba(255,255,255,0.28)" stroke-width="0.8"/>
        <text x="116" y="433" text-anchor="middle" fill="#a1a1a1" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.08em">PROFILE</text>
        <text x="188" y="446" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600" font-family="'Figtree','Geist',sans-serif">Agent credential</text>
      </g>

      <g role="group" aria-label="Provider API">
        <rect x="896" y="184" width="232" height="48" rx="6" fill="#111114" stroke="#404040" stroke-width="1"/>
        <rect x="904" y="192" width="48" height="12" rx="2" fill="transparent" stroke="rgba(255,255,255,0.28)" stroke-width="0.8"/>
        <text x="928" y="201" text-anchor="middle" fill="#a1a1a1" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.08em">API</text>
        <text x="1012" y="214" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600" font-family="'Figtree','Geist',sans-serif">GitHub · GitLab · Jira</text>
      </g>
      <g role="group" aria-label="Repository remote">
        <rect x="896" y="300" width="232" height="48" rx="6" fill="#111114" stroke="#404040" stroke-width="1"/>
        <rect x="904" y="308" width="64" height="12" rx="2" fill="transparent" stroke="rgba(255,255,255,0.28)" stroke-width="0.8"/>
        <text x="936" y="317" text-anchor="middle" fill="#a1a1a1" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.08em">REMOTE</text>
        <text x="1012" y="330" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600" font-family="'Figtree','Geist',sans-serif">Repository</text>
      </g>
      <g role="group" aria-label="Agent CLI">
        <rect x="896" y="416" width="232" height="48" rx="6" fill="#111114" stroke="#404040" stroke-width="1"/>
        <rect x="904" y="424" width="64" height="12" rx="2" fill="transparent" stroke="rgba(255,255,255,0.28)" stroke-width="0.8"/>
        <text x="936" y="433" text-anchor="middle" fill="#a1a1a1" font-size="7" font-family="'Geist Mono',monospace" letter-spacing="0.08em">RUNTIME</text>
        <text x="1012" y="446" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600" font-family="'Figtree','Geist',sans-serif">Agent CLI</text>
      </g>

      <line x1="40" y1="496" x2="1160" y2="496" stroke="rgba(255,255,255,0.12)" stroke-width="0.8"/>
      <line x1="64" y1="524" x2="96" y2="524" stroke="#6468f0" stroke-width="1.4" marker-end="url(#integrations-arrow-accent)"/>
      <text x="112" y="528" fill="#6468f0" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.06em">WORKSPACE SCOPE</text>
      <line x1="312" y1="524" x2="344" y2="524" stroke="#a1a1a1" stroke-width="1.2" marker-end="url(#integrations-arrow)"/>
      <text x="360" y="528" fill="#a1a1a1" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.06em">EXECUTOR SCOPE</text>
      <text x="680" y="528" fill="#737373" font-size="9" font-family="'Geist Mono',monospace" letter-spacing="0.06em">CONFIGURE THE PATH THAT FAILED</text>
    </svg>
